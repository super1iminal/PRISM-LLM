# Named conditions: partial overrides of default.yaml. See docs/ablations.md for what each one tests.
# Run with: python src/run_ablation.py <condition> --seeds 1 2
# The default retry changed on Oct 3 from "stall:2" to "gain:0.05" (R4 won the sweep). Conditions that ran
# before that pin "stall:2" (OLD), so they still mean exactly what was run.

# Main comparison
B2: {planner: {retry: "stall:2"}}         # symbolic, all defaults as of the ablation runs (OLD)
B1: {approach: legacy}                    # legacy baseline (obstacle phase visible too)

# Retry-policy sweep (vs. B2)
R1: {planner: {retry: never}}
R2: {planner: {retry: "stall:1"}}
R3: {planner: {retry: "every:3"}}
R4: {planner: {retry: "gain:0.05"}}       # = the current default
R5: {planner: {retry: always}}            # pure resampling: the initial prompt every round

# Factor ablations (vs. B2 / B1)
S1: {planner: {feedback: table, retry: "stall:2"}}   # results table + previous rules; no blame, no REFINE/EXTEND framing
S4: {prompt: {examples: false}, planner: {retry: "stall:2"}}
S5: {feedback: {blame: regret}, planner: {retry: "stall:2"}}   # one-step regret instead of probability mass
L1: {approach: legacy, legacy: {retry: "stall:2"}}   # legacy with B2's blind retry
L2: {approach: legacy, legacy: {examples: false}}    # legacy without its two worked examples

# Blame validation (vs. B2 = top-k by mass, and S5 = regret)
V1: {feedback: {blame: random}, planner: {retry: "stall:2"}}   # k random rules / states, same prompt shape
V2: {feedback: {blame: none}, planner: {retry: "stall:2"}}     # REFINE/EXTEND framing, but no blame section

# Rounds budget with the new default (restart on slow progress), vs. R4 (5 rounds)
D7: {planner: {max_rounds: 7}}

# Second case study (UUV, with the energy requirement)
U1: {domain: {name: uuv, dataset: uuv_paper.csv}, planner: {retry: "stall:2"}}

# Reproduce the runs made before Phase A (obstacle hidden, per-requirement branch)
pre_phase_a: {domain: {visible_extra: []}, planner: {branch: per_requirement, retry: "stall:2"}}
