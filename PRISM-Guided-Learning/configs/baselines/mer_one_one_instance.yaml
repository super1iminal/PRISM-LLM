# The strategy of one instance applied to the others on Mars Exploration Rovers trained on one instance (RQ1 mer_one): n
# = 1, x = 0.01 (id 7), as 1-2-3-Go!'s paper: the optimal strategy of that instance as a table over the visible state,
# looked up on ids 0-8 by `k` (requests made) or by `shortcuts_left` (requests left). States never seen at n = 1 stay
# open (worst case).
method: one_instance
condition: mer_baseline
dataset: mer_transfer.csv
target_dataset: null
train: "7"
targets: "0-8"
workers: 1
exact_near: 0.0
params:
  instance: 7
  keys:
    one_instance_k: [s, r, k, commUser, driveUser, gc, gd, dc, dd, s1, r1, rescind1, s2, r2, rescind2, e, u]
    one_instance_left: [s, r, shortcuts_left, commUser, driveUser, gc, gd, dc, dd, s1, r1, rescind1, s2, r2, rescind2, e, u]
