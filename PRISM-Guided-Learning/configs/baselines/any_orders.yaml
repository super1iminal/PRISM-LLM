# What `any` costs: every distinct final rule set of the Haiku runs with `closer`
# (single-grid and multi-instance), as written (`@any`) and with each `any` rule rewritten into a fixed direction
# order (src/diagnose_rules.py orders), certified on all 20 grids of grid_20_large.
method: rule_lists
condition: haiku_mi_grid_large_closer   # general vocabulary v2 with closer
dataset: grid_20_large.csv
target_dataset: null          # targets from another dataset (null: the same)
train: ""
targets: "0-19"
workers: 8
exact_near: 0.03
params:
  files: [out/results/archive/transfer_search/diagnosis/any_orders.yaml]
