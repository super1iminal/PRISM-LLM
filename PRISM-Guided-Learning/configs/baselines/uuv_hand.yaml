# The hand-written list of the UUV family's gate (src/uuv_gate.py, Rajan's checklist, item 8), in the rule vocabulary:
# search at medium altitude; once forced down to low, stay low until the visibility is one level above the poor band;
# keep high once there. Written while building the family (it is the gate's witness that one list certifies every
# member), so it is a hand-written reference, not a blind baseline.
method: rule_lists
condition: uuv_baseline
dataset: uuv_family_v0.csv
target_dataset: null
train: ""
targets: "0-29"
workers: 1
exact_near: 0.0
params:
  lists:
    hand:
      - ["alt = LOW & !starting & water_visib < FIRST_AVG + 1", "low"]
      - ["alt = HIGH", "high"]
      - ["true", "med"]
