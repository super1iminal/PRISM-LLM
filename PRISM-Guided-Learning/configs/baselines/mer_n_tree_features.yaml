# 1-2-3-Go! with our features on Mars Exploration Rovers across n: mer_n_tree_raw.yaml, but the tree's inputs are the
# rule-language features (shortcuts_left, and enabled for each of the 27 actions).
method: decision_tree
condition: mer_baseline
dataset: mer_n_transfer.csv
target_dataset: null
train: "0-2"
targets: "0-8"
workers: 1
exact_near: 0.03
params:
  model: explicit
  inputs: features
  features: [shortcuts_left, enabled]
  max_depth: null
  sets: {n1: [0], n1_3: [0, 1, 2]}
