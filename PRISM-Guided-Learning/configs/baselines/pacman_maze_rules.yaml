# Diagnosis: hand-written Pac-Man rule lists over the maze-distance features closer_g0/closer_g1, certified on
# horizons 8-25 (pacman_transfer.csv), to see whether the vocabulary can hold the optimum beyond horizon 18.
method: rule_lists
condition: haiku_mi_pacman
dataset: pacman_transfer.csv
target_dataset: null          # targets from another dataset (null: the same)
train: ""
targets: "0-7"
workers: 2
exact_near: 0.0
params:
  lists:
    flee_maze_any:
      - ["!wall & !closer_g0 & !closer_g1", "any"]
      - ["!wall & !closer_g0", "any"]
      - ["!wall & !closer_g1", "any"]
      - ["!wall", "any"]
      - ["true", "right"]
    flee_both_any:
      - ["!wall & !closer_g0 & !closer_g1 & !nearer_g0 & !nearer_g1", "any"]
      - ["!wall & !closer_g0 & !closer_g1", "any"]
      - ["!wall & !closer_g0", "any"]
      - ["!wall & !closer_g1", "any"]
      - ["!wall", "any"]
      - ["true", "right"]
