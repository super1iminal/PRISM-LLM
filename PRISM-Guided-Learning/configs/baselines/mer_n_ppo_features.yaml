# PPO on Mars Exploration Rovers across n with our features: mer_n_ppo_raw.yaml, but the network sees the
# rule-language features (shortcuts_left; enabled per action).
method: ppo
condition: mer_baseline
dataset: mer_n_transfer.csv
target_dataset: null
train: "0-2"
targets: "0-8"
workers: 1
exact_near: 0.0
params:
  model: explicit
  observation: features
  features: [shortcuts_left, enabled]
  steps: 1000000
  envs: 32
  seeds: [0, 1, 2]
