# 1-2-3-Go! reimplemented on the UUV family (Rajan's checklist, item 8; src/baselines/decision_tree.py, model: explicit):
# a tree over the raw policy-visible variables (s, alt, water_visib) learned from every optimal action of the training
# members' decision states for the objective "done within the deadline and no thruster failure" (`F ("done" & t<=D &
# ok)` on the model with a step counter and a failure flag; UUV.objective, requirement: objective), compiled into rules,
# frozen and certified on the family's training and validation members (ids 0-29) against all three requirements.
method: decision_tree
condition: uuv_baseline
dataset: uuv_family_v0.csv
target_dataset: null
train: "0,6,10"
targets: "0-29"
workers: 1
exact_near: 0.03
params:
  model: explicit
  inputs: raw
  requirement: objective
  max_depth: null
  sets: {train: [0, 6, 10]}
