# The strategy of one instance applied to the others on randomised consensus across K (src/baselines/simple.py,
# Marsha's baseline): the optimal strategy of K = 4 (id 2, the largest training K) as a table over the visible state,
# looked up on ids 0-8 by the counter itself, or by its distance to the heads barrier (to_heads) or to the tails
# barrier (to_tails). States never seen at K = 4 stay open (worst case).
method: one_instance
condition: consensus_baseline
dataset: consensus_transfer.csv
target_dataset: null
train: "2"
targets: "0-8"
workers: 1
exact_near: 0.0
params:
  instance: 2
  keys:
    one_instance_counter: [counter, pc1, coin1, pc2, coin2, pc3, coin3]
    one_instance_heads: [to_heads, pc1, coin1, pc2, coin2, pc3, coin3]
    one_instance_tails: [to_tails, pc1, coin1, pc2, coin2, pc3, coin3]
