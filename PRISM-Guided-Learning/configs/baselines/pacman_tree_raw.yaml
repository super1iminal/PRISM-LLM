# 1-2-3-Go! reimplemented on Pac-Man (src/baselines/decision_tree.py, model: explicit): a tree over the raw state
# variables (xP, yP, dP, xG0, ..., steps, as the paper) learned from every optimal action of the training horizons'
# decision states, compiled into rules, frozen and certified on the validation horizons (pacman_transfer.csv ids
# 0-9: 8-25, 5, 30). Two trees: horizon 5 (id 8, the paper's training instance) and horizons 14, 16, 18 (ids 3-5,
# our training set). fit.json has their sizes and their rules, one per leaf.
method: decision_tree
condition: pacman_baseline     # numbers allowed in conditions
dataset: pacman_transfer.csv
target_dataset: null
train: "3-5,8"
targets: "0-9"
workers: 1
exact_near: 0.03
params:
  model: explicit
  inputs: raw
  max_depth: null
  sets: {h5: [8], h14_18: [3, 4, 5]}
