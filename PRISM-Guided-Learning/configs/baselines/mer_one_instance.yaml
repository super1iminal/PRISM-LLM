# The strategy of one instance applied to the others on Mars Exploration Rovers (src/baselines/simple.py, Marsha's
# baseline): the optimal strategy of x = 0.13 (id 2, the largest training x) as a table over the visible state,
# looked up on ids 0-8. The instances share their state space at n = 10, so every state is decided there.
method: one_instance
condition: mer_baseline
dataset: mer_transfer.csv
target_dataset: null
train: "2"
targets: "0-8"
workers: 1
exact_near: 0.0
params:
  instance: 2
  keys:
    one_instance: [s, r, k, commUser, driveUser, gc, gd, dc, dd, s1, r1, rescind1, s2, r2, rescind2, e, u]
