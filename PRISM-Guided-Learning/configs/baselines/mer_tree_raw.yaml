# 1-2-3-Go! reimplemented on Mars Exploration Rovers (src/baselines/decision_tree.py, model: explicit): a tree over
# the raw state variables (s, r, k, ..., e, u, as the paper) learned from every optimal action of the training
# instances' decision states, compiled into rules, frozen and certified on mer_transfer.csv ids 0-8 (training and
# validation). Two trees: n = 1, x = 0.01 (id 7, the paper's training instance) and x = 0.01, 0.05, 0.13 at n = 10
# (ids 0-2, our training set). Ids 9-11 are sealed.
method: decision_tree
condition: mer_baseline
dataset: mer_transfer.csv
target_dataset: null
train: "0-2,7"
targets: "0-8"
workers: 1
exact_near: 0.03
params:
  model: explicit
  inputs: raw
  max_depth: null
  sets: {n1: [7], x_train: [0, 1, 2]}
