# 1-2-3-Go!-style decision tree over our rule-language features without the shortest-path feature `closer` (the
# features haiku_ts_order_noclose offers), learned from the optimal strategies of each standard training set,
# frozen, certified on all 20 grids. RQ1 (configs/experiments/rq1_comparison.yaml, grids_noclose).
method: decision_tree
condition: null                # the tree's policy is written as rules over cells: the base rule language
dataset: grid_20_large.csv
target_dataset: null          # targets from another dataset (null: the same)
train: "0-11"
targets: "0-19"
workers: 4
exact_near: 0.03
params:
  inputs: features
  features: [wall, hazard, risky, toward, obstacle]
  max_depth: null
  sets: [[0, 4, 8], [1, 5, 9], [2, 6, 10], [3, 7, 11]]
