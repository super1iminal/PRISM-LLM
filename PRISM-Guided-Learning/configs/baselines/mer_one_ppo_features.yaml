# PPO on Mars Exploration Rovers trained on one instance (RQ1 mer_one): n = 1, x = 0.01 (id 7), as 1-2-3-Go!'s paper,
# with our features: mer_one_ppo_raw.yaml, but the network sees the rule-language features (shortcuts_left; enabled per
# action).
method: ppo
condition: mer_baseline
dataset: mer_transfer.csv
target_dataset: null
train: "7"
targets: "0-8"
workers: 1
exact_near: 0.0
params:
  model: explicit
  observation: features
  features: [shortcuts_left, enabled]
  steps: 1000000
  envs: 32
  seeds: [0, 1, 2]
