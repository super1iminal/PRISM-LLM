# Search over the rule language (src/baselines/feature_search.py), one list per gridworld family, trained on its
# 6x6-8x8 members (seed 0), frozen, certified on its 10x10-14x14 members. Features as haiku_fam_split (patrol and
# early instead of hazard).
method: feature_search
condition: haiku_fam_split
dataset: families_v0.csv
train: "0,4,8,60,64,68,120,124,128"
targets: "16-35,76-95,136-155"
workers: 4
exact_near: 0.03
params:
  features: [wall, patrol, early, risky, toward, closer, obstacle]
  orders: rotations
  max_rules: 6
  beam: 4
  workers: 8
  sets: [[0, 4, 8], [60, 64, 68], [120, 124, 128]]
