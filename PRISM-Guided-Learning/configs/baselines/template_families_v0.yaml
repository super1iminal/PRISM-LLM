# The hand-written template on the gridworld families (families_v0.csv: rooms, crossing, adjacent; sizes
# 6-20, seeds 0-3), to check that the families are not trivial (docs/experiments.md, "Datasets and splits").
method: template
condition: null
dataset: families_v0.csv
target_dataset: null          # targets from another dataset (null: the same)
train: ""
targets: "0-35,60-95,120-155"   # training and validation members; the sealed test members (36-59, 96-119, 156-179) stay unchecked
workers: 4
exact_near: 0.03
params:
  variants: [greedy, cautious]
