# Best of 1000 random deterministic memoryless policies on the UUV family (Asher's UUV plan, step 6;
# src/baselines/simple.py): each a seeded hash of the visible state (s, alt, water_visib), ranked by its summed
# worst-case probability of "done within the deadline and no thruster failure" on the training members (ids 0, 6, 10;
# UUV.objective, requirement: objective, as the trees and PPO learn); the best is certified on ids 0-29 as one rule
# per decision state (`certify: rules`: the energy requirement is an expected reward).
method: random_policies
condition: uuv_baseline
dataset: uuv_family_v0.csv
target_dataset: null
train: "0,6,10"
targets: "0-29"
workers: 1
exact_near: 0.0
params:
  count: 1000
  seed: 0
  requirement: objective
  certify: rules
