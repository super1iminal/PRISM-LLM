# PPO with our features on the UUV family (Rajan's checklist, item 8; src/baselines/ppo.py, model: explicit): trained on
# the training members' models with a step counter and failure flag, reward +1 on "done within the deadline and no
# thruster failure" (UUV.objective, requirement: objective). Observations: the rule-language features. Frozen as the
# most likely action per decision state and certified as one rule per decision state (`certify: rules`: the energy
# requirement is an expected reward, which the explicit-model certification does not handle).
method: ppo
condition: uuv_baseline
dataset: uuv_family_v0.csv
target_dataset: null
train: "0,6,10"
targets: "0-29"
workers: 1
exact_near: 0.0
params:
  model: explicit
  observation: features
  features: null
  requirement: objective
  certify: rules
  steps: 1000000
  envs: 32
  seeds: [0, 1, 2]
  sets: {train: [0, 6, 10]}
