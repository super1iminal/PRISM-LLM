# 1-2-3-Go!-style trees over our features plus the optional `collide` (the move or a slip of it can end where the moving
# obstacle goes next), one per gridworld family, as tree_features_families otherwise (the fair bar for rules.extra_features: [collide]).
method: decision_tree
condition: null
dataset: families_v0.csv
target_dataset: null          # targets from another dataset (null: the same)
train: "0,4,8,60,64,68,120,124,128"
targets: "16-35,76-95,136-155"
workers: 1
exact_near: 0.03
params:
  inputs: features
  features: [wall, hazard, risky, toward, closer, obstacle, patrol, early, collide]
  max_depth: null
  sets: [[0, 4, 8], [60, 64, 68], [120, 124, 128]]
