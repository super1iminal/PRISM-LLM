# The strategy of one instance applied to the others on the UUV family (Asher's UUV plan, step 6; src/baselines/
# simple.py): the optimal strategy of the largest training member, id 6 (W 8, inspection 8 m), for "done within the
# deadline and no thruster failure" (UUV.objective, requirement: objective), as a table over the visible state
# (s, alt, water_visib), looked up on ids 0-29 and certified as one rule per decision state (`certify: rules`).
# The objective model also has the step counter and the failure flag: one key covers the states that differ only
# in them, and takes the action optimal in most of them. As on MER across n, keys a target has and id 6 lacks
# (visibility values outside W 8's range) are left undecided, so the worst case covers them.
method: one_instance
condition: uuv_baseline
dataset: uuv_family_v0.csv
target_dataset: null
train: "6"
targets: "0-29"
workers: 1
exact_near: 0.0
params:
  instance: 6
  requirement: objective
  certify: rules
  keys:
    one_instance: [s, alt, water_visib]
