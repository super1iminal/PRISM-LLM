# 1-2-3-Go! with our features on randomised consensus across K: consensus_tree_raw.yaml, but the tree's inputs are the
# rule-language features (to_heads, to_tails, heads_decided, tails_decided, and finished, stage and coin for each of the three
# actions). Constants such as START are not state features, so the tree cannot compare the counter with them.
method: decision_tree
condition: consensus_baseline
dataset: consensus_transfer.csv
target_dataset: null
train: "0-2"
targets: "0-8"
workers: 1
exact_near: 0.03
params:
  model: explicit
  inputs: features
  features: [to_heads, to_tails, heads_decided, tails_decided, finished, stage, coin]
  max_depth: null
  sets: {k2: [0], k2_4: [0, 1, 2]}
