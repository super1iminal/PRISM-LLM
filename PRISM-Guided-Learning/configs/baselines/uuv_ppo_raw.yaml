# PPO over the raw policy-visible variables on the UUV family (Asher's UUV plan, step 6): uuv_ppo_features.yaml with
# only `observation: raw` (s, alt, water_visib, scaled by their declared ranges over the training members). Trained
# on "done within the deadline and no thruster failure" (UUV.objective, requirement: objective), frozen as the most
# likely action per decision state and certified as one rule per decision state (`certify: rules`: the energy
# requirement is an expected reward, which the explicit-model certification does not handle). Networks:
# out/results/baselines/uuv_ppo_raw/nets.pt (`--nets`), reused by the sealed test pass.
method: ppo
condition: uuv_baseline
dataset: uuv_family_v0.csv
target_dataset: null
train: "0,6,10"
targets: "0-29"
workers: 1
exact_near: 0.0
params:
  model: explicit
  observation: raw
  features: null
  requirement: objective
  certify: rules
  steps: 1000000
  envs: 32
  seeds: [0, 1, 2]
  sets: {train: [0, 6, 10]}
