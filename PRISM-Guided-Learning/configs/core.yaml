# The core runs: the method's main configuration on each case study, the runs the paper's main results come from.
# Every other condition is an ablation. src/run_ablation.py and src/run_search.py write core conditions to
# out/results/core/<condition>/ and all others to out/results/ablations/<condition>/; baselines are in
# out/results/baselines/. A condition moves here only when it becomes part of the main results.
conditions:
  - haiku_ts_order            # random grids (grid_20_large), with closer
  - haiku_ts_order_noclose    # random grids, without closer
  - haiku_fam_order           # gridworld families
  - haiku_mi_pacman_long      # Pac-Man, horizons 14-18
  - sonnet5_5_ts_order        # Sonnet 5.5, random grids (one repeat)
  - sonnet5_5_fam_order       # Sonnet 5.5, families (one repeat)
