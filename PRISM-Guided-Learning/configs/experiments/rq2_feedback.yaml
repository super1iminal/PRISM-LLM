# RQ2a: feedback against restarts. Does the verifier's feedback help, compared with starting over (from the initial
# prompt, keeping the best rule list), or with feedback that restarts when it stops paying off? Revisits the retry
# sweep (conditions R1-R5) with the transfer setting's core configuration. Restarts are compared with feedback at
# equal cost on budget curves (src/budget_transfer.py, viz/plot_budget_transfer.py; plan 03).
#   python src/run_experiment.py configs/experiments/rq2_feedback.yaml --run --check
#   python src/budget_transfer.py configs/experiments/rq2_feedback.yaml     # budget curves (PRISM only), then report
kind: ablation
title: "RQ2a: feedback, restarts, or both"
question: >
  Each round either refines the rule list with the verifier's feedback or starts over from the initial prompt; the
  best list so far is kept either way. Restarts only sends the initial prompt every round, byte for byte, with
  nothing from earlier rounds (checked in the `llm_tasks.jsonl` of its six runs; round 1 of every cell is that same
  prompt). In every cell the verifier still resolves `any` rules into the action order that does best on the
  training members, and keep-best still applies: both arms share those two roles of the verifier, and differ only
  in whether the next prompt carries its feedback. Feedback rounds cost more (longer prompts, about 3.4 times the
  output tokens), so equal rounds is not equal cost: the question is settled at equal cost, by three comparisons
  fixed before the equal-cost runs, on every benchmark: feedback with no restarts against restarts only at equal cost,
  in (a) held-out targets certified per list at feedback's mean spend after its 5 rounds, (b) the same at half that
  spend, and (c) training sets solved at feedback's mean spend.
benchmarks: rq2
repeats: 3
reference: "Feedback, no restarts (core)"
prices:
  anthropic/claude-haiku-5.5: [0.10, 0.50]

# Planned comparisons (fixed Oct 15, before the runs of "Restarts only, equal cost"; src/budget_transfer.py `planned`).
# Each run is read at a budget per training set: the list keep-best holds after its last round within the budget.
# Budget = `at` x the reference cell's mean dollars per training set over its rounds (each run's mean over its sets,
# then over runs). Δ = reference minus `cell`, 95% bootstrap interval over runs, two-sided bootstrap p, Holm over all
# comparisons on all benchmarks together. Anything else read off the budget curves is exploratory.
# Oct 15 evening (Asher), after the first 5 v 5 grid result: both arms raised to 10 runs on every benchmark, and an
# exact two-sided permutation test over runs reported beside the bootstrap, each with Holm over all 9 (m = 9 always).
# The comparisons themselves are unchanged.
budget:
  plot: configs/plot/budget_transfer.yaml
  reference: "Feedback, no restarts (core)"
  cost: dollars
  level: 0.95
  note: >
    Fixed before the equal-cost runs (plan 03): feedback with no restarts against restarts only at equal cost, on
    every benchmark. Budgets are per training set, in dollars at the prices above, as multiples of feedback's mean
    spend after its 5 rounds. Keep-best makes every curve rise, so only the comparison at equal spend is evidence;
    any other reading of the figure is exploratory.
  planned:
    - {name: "(a) certified per list at feedback's spend", metric: certified,
       cell: "Restarts only, equal cost (18 rounds)", at: 1.0}
    - {name: "(b) certified per list at half of feedback's spend", metric: certified,
       cell: "Restarts only, equal cost (18 rounds)", at: 0.5}
    - {name: "(c) training sets solved at feedback's spend", metric: solved,
       cell: "Restarts only, equal cost (18 rounds)", at: 1.0}

cells:
  - name: "Feedback, no restarts (core)"
    code: F
    repeats: 10                  # an arm of the planned comparisons (Asher: 10 runs per arm)
  - name: "Feedback, restart when a round gains < 0.05"
    code: F+R gain
    set: ["planner.retry=gain:0.05"]
  - name: "Feedback, restart after 2 rounds without gain"
    code: F+R stall
    set: ["planner.retry=stall:2"]
  - name: "Restarts only (no feedback)"
    code: R
    repeats: 5
    set: ["planner.retry=always"]
  # Feedback spends 3.43 (grids) and 3.38 (families) times the output tokens of restarts only per set, and 2.1 times
  # the dollars: 18 rounds covers feedback's mean spend in both measures. Rounds 1-5 are the restarts-only process.
  - name: "Restarts only, equal cost (18 rounds)"
    code: R 18
    repeats: 10                  # an arm of the planned comparisons (Asher: 10 runs per arm)
    set: ["planner.retry=always", "planner.max_rounds=18"]
  # A longer feedback curve: the runs of rq2_training's "More rounds" cell (the store finds them); nothing launched.
  - name: "Feedback, more rounds (8 grids, 10 families)"
    code: F more
    only: [grids, families]
    set: {grids: ["planner.max_rounds=8"], families: ["planner.max_rounds=10"]}
    launch: false
