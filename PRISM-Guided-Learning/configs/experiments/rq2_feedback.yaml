# RQ2a: feedback against restarts. Does the verifier's feedback help, compared with starting over (from the initial
# prompt, keeping the best rule list), or with feedback that restarts when it stops paying off? Revisits the retry
# sweep (conditions R1-R5) with the transfer setting's core configuration.
#   python src/run_experiment.py configs/experiments/rq2_feedback.yaml --run
kind: ablation
title: "RQ2a: feedback, restarts, or both"
question: >
  Each round either refines the rule list with the verifier's feedback or starts over from the initial prompt; the
  best list so far is kept either way.
benchmarks: rq2
repeats: 3
reference: "Feedback, no restarts (core)"
prices:
  anthropic/claude-haiku-5.5: [0.10, 0.50]
cells:
  - name: "Feedback, no restarts (core)"
    code: F
    repeats: 5
  - name: "Feedback, restart when a round gains < 0.05"
    code: F+R gain
    set: ["planner.retry=gain:0.05"]
  - name: "Feedback, restart after 2 rounds without gain"
    code: F+R stall
    set: ["planner.retry=stall:2"]
  - name: "Restarts only (no feedback)"
    code: R
    set: ["planner.retry=always"]
