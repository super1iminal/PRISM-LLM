# RQ2c: prompting. The core prompt (with the instruction that the rules will be certified unchanged on unseen,
# larger instances) against variants.
#   python src/run_experiment.py configs/experiments/rq2_prompting.yaml --run
kind: ablation
title: "RQ2c: prompting"
question: >
  Do changes to what the prompt asks for change how well the rules transfer?
benchmarks: rq2
repeats: 3
reference: "Core prompt (generality instruction)"
prices:
  anthropic/claude-haiku-5.5: [0.10, 0.50]
cells:
  - name: "Core prompt (generality instruction)"
    code: Core
    repeats: 5
  - name: "No generality instruction"
    code: No general
    set: ["prompt.generality=false"]
  - name: "Strategy in words first"
    code: Strategy
    set: ["prompt.strategy_first=true"]
  - name: "Tie-breaking explained"
    code: Ties
    set: ["prompt.tie_break=true"]
  - name: "No worked examples"
    code: No examples
    set: ["prompt.examples=false"]
