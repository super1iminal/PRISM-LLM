# RQ2d: feature engineering in the domain. Which of the domain's features the rule language offers (all computed
# from the instance's layout, none from PRISM; domains/gridworld/domain.py, rule_vocabulary).
#   python src/run_experiment.py configs/experiments/rq2_features.yaml --run
kind: ablation
title: "RQ2d: the domain's features"
question: >
  How much does the rules' transfer depend on the features the domain provides?
benchmarks: rq2
repeats: 3
reference: "All features (core)"
prices:
  anthropic/claude-haiku-5.5: [0.10, 0.50]
cells:
  - name: "All features (core)"
    code: All
    repeats: 5
  - name: "No shortest-path feature `closer`"
    code: -closer
    only: [grids, families]            # gridworld feature names (here and below)
    set: {grids: ["rules.hidden_features=[closer, patrol, early]"], families: ["rules.hidden_features=[closer, hazard]"]}
  - name: "Local features only (no `closer`, no `toward`)"
    code: Local
    only: [grids, families]
    set: {grids: ["rules.hidden_features=[closer, toward, patrol, early]"],
          families: ["rules.hidden_features=[closer, toward, hazard]"]}
  - name: "No slip feature `risky`"
    code: -risky
    only: [grids, families]
    set: {grids: ["rules.hidden_features=[risky, patrol, early]"], families: ["rules.hidden_features=[risky, hazard]"]}
  - name: "No obstacle-timing feature `obstacle`"
    code: -obstacle
    only: [grids, families]
    set: {grids: ["rules.hidden_features=[obstacle, patrol, early]"],
          families: ["rules.hidden_features=[obstacle, hazard]"]}
  - name: "`hazard` split into `patrol` and `early`"
    code: Split
    only: [grids]
    set: ["rules.hidden_features=[hazard]"]
  - name: "`hazard` as one feature"
    code: Unsplit
    only: [families]
    set: ["rules.hidden_features=[patrol, early]"]
  - name: "No features (coordinates and goal constants only)"
    code: None
    only: [grids, families]
    set: ["rules.hidden_features=[wall, hazard, risky, toward, closer, obstacle, patrol, early]"]
