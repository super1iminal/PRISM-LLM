# RQ2e: training data and budget. How many instances a rule list is written for, extra members it is scored on but
# never shown, counterexample-driven training sets, and more rounds.
#   python src/run_experiment.py configs/experiments/rq2_training.yaml --run
kind: ablation
title: "RQ2e: training sets and rounds"
question: >
  Does training a rule list on more instances, or for longer, make it transfer better?
benchmarks: rq2
repeats: 3
reference: "Three instances per set, 5 rounds (core)"
prices:
  anthropic/claude-haiku-5.5: [0.10, 0.50]
cells:
  - name: "Three instances per set, 5 rounds (core)"
    code: Core
    repeats: 5
  - name: "One instance per set"
    code: One
    set: {grids: ["run.train_sets=[[0], [1], [2], [3]]"], families: ["run.train_sets=[[0], [60], [120]]"]}
  - name: "Six instances per set"
    code: Six
    set: {grids: ["run.train_sets=[[0, 4, 8, 1, 5, 9], [2, 6, 10, 3, 7, 11]]"],
          families: ["run.train_sets=[[0, 1, 4, 5, 8, 9], [60, 61, 64, 65, 68, 69], [120, 121, 124, 125, 128, 129]]"]}
  - name: "Three more instances scored but not shown"
    code: Hidden
    set: {grids: ["run.hidden_sets=[[1, 5, 9], [2, 6, 10], [3, 7, 11], [0, 4, 8]]"],
          families: ["run.hidden_sets=[[1, 5, 9], [61, 65, 69], [121, 125, 129]]"]}
  - name: "More rounds (8 grids, 10 families)"
    code: Rounds
    set: {grids: ["planner.max_rounds=8"], families: ["planner.max_rounds=10"]}
  - name: "More rounds, failing instances added to the set"
    code: Grow
    set: {grids: ["planner.max_rounds=8",
                  "run.pool_sets=[[1, 2, 3, 5, 6, 7, 9, 10, 11], [0, 2, 3, 4, 6, 7, 8, 10, 11], [0, 1, 3, 4, 5, 7, 8, 9, 11], [0, 1, 2, 4, 5, 6, 8, 9, 10]]"],
          families: ["planner.max_rounds=10",
                     "run.pool_sets=[[1, 2, 3, 5, 6, 7, 9, 10, 11], [61, 62, 63, 65, 66, 67, 69, 70, 71], [121, 122, 123, 125, 126, 127, 129, 130, 131]]"]}
