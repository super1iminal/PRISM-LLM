# RQ2b: what the verifier tells the LLM. The full feedback (results, the REFINE/EXTEND branch, blame per rule by
# probability mass, uncovered hotspots) against less or different feedback. Plan 04: feedback in feature space
# (states named by goal flags and features, never positions) at 5 repeats; notes in
# out/results/experiments/rq2_verifier_output/FEATURE_SPACE.md.
#   python src/run_experiment.py configs/experiments/rq2_verifier_output.yaml --run
kind: ablation
title: "RQ2b: what the verifier tells the LLM"
question: >
  Which parts of the verifier's output help the LLM write rules that transfer?
benchmarks: rq2
repeats: 3
reference: "Full feedback (core)"
prices:
  anthropic/claude-haiku-5.5: [0.10, 0.50]
cells:
  - name: "Full feedback (core)"
    code: Full
    repeats: 5
  - name: "Blame by one-step regret"
    code: Regret
    set: ["feedback.blame=regret"]
  - name: "Random blame (placebo)"
    code: Random
    set: ["feedback.blame=random"]
    repeats: 5
  - name: "No blame"
    code: No blame
    set: ["feedback.blame=none"]
  - name: "Results table only"
    code: Table
    set: ["planner.feedback=table"]
  - name: "States named by their features"
    code: Feature space
    set: ["feedback.space=features"]
    repeats: 5
  - name: "Plus a failing trace"
    code: Trace
    set: ["feedback.trajectory=true"]
