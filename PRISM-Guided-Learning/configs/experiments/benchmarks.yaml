# Benchmark sets experiments refer to by name (`benchmarks: rq2`), so ablations share one definition.
# A benchmark: the condition cells start from (`base`), held-out `targets`, an optional target `dataset`, and
# `groups` / `source_groups` when each rule list belongs to one group of targets (a family).
rq2:
  grids:
    label: "Random grids"
    base: haiku_ts_order
    targets: "12-19"
  families:
    label: "Gridworld families"
    base: haiku_fam_order
    targets: "16-35,76-95,136-155"
    groups: {rooms: "16-35", crossing: "76-95", adjacent: "136-155"}
    source_groups: {"0": rooms, "1": crossing, "2": adjacent}
