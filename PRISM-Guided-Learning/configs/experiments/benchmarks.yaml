# Benchmark sets experiments refer to by name (`benchmarks: rq2`), so ablations share one definition.
# A benchmark: the condition cells start from (`base`), held-out `targets`, an optional target `dataset`, and
# `groups` / `source_groups` when each rule list belongs to one group of targets (a family). A cell that applies to
# some benchmarks only says so with `only:`, or gives its `set` per benchmark (it then runs on those it names).
rq2:
  grids:
    label: "Random grids"
    base: haiku_ts_order
    targets: "12-19"
  families:
    label: "Gridworld families"
    base: haiku_fam_order
    targets: "16-35,76-95,136-155"
    groups: {rooms: "16-35", crossing: "76-95", adjacent: "136-155"}
    source_groups: {"0": rooms, "1": crossing, "2": adjacent}
  pacman:
    label: "Pac-Man (trained on horizons 14, 16, 18; 6 held out: 8, 10, 12, 20, 25, 30)"
    base: haiku_mi_pacman_long
    targets: "0-7,9"                   # ids 3-5 are the training members, left out by the metrics; id 8 (horizon 5) is
                                       # out: every policy gets 0.5511 there (the bare model's min equals its max)
    dataset: pacman_transfer.csv
