# RQ2f: how the open choices of `any` rules are resolved. The verifier picks the best action order on the training
# members each round (core), or a smaller choice, or none (worst case over the choices, or a fixed order the LLM is
# told), or it only reports the best order.
#   python src/run_experiment.py configs/experiments/rq2_choices.yaml --run
kind: ablation
title: "RQ2f: who resolves the open choices"
question: >
  How much does the verifier's choice of action order contribute, during training, to rules that transfer?
benchmarks: rq2
repeats: 3
reference: "Best order each round (core: of 24; Pac-Man: of 4 rotations)"
prices:
  anthropic/claude-haiku-5.5: [0.10, 0.50]
cells:
  - name: "Best order each round (core: of 24; Pac-Man: of 4 rotations)"
    code: Core
    repeats: 5
  - name: "Best of 4 rotations each round"
    code: Rotations
    only: [grids, families]            # Pac-Man's core already uses the rotations
    set: ["rules.any_order=rotations"]
  - name: "Best of 24 orders each round"
    code: All 24
    set: {pacman: ["rules.any_order=all"]}
  - name: "Fixed declared order (no choice)"
    code: Declared
    set: ["rules.any_order=declared"]
  - name: "Best order only reported"
    code: Report
    set: ["rules.any_order=report"]
  - name: "Worst case over the choices"
    code: None
    set: ["rules.any_order=none"]
