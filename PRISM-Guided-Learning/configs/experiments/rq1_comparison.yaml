# RQ1: how do LLM-written rule lists, refined with the verifier's feedback, compare with the baselines on held-out
# instances? Our best configuration per benchmark against each baseline's best configuration. These cells are the
# core runs (out/results/core/). Validation targets only; the sealed test set stays sealed until Asher says so.
# `method` groups configurations of one method (e.g. trees over raw variables and over our features); the figures show
# each method's best configuration on validation (src/experiments/comparison.py), the tables every configuration.
#   python src/run_experiment.py configs/experiments/rq1_comparison.yaml [--check] [--baselines]
kind: comparison
title: "RQ1: LLM-written rule lists against the baselines (validation)"
question: >
  How many held-out instances does one frozen rule list certify, per method, and how many does a library of a run's
  lists cover? Our cells use the core configuration (the verifier resolves `any` into the best action order on the
  training members each round, no restarts, the generality instruction).
repeats: 5
prices:                                # $ per M prompt tokens, $ per M output tokens
  anthropic/claude-haiku-5.5: [0.10, 0.50]
  anthropic/claude-sonnet-5.5: [3.00, 15.00]

benchmarks:
  grids:
    label: "Random grids (grid_20_large; trained on sets of three 9x9-13x13 grids, held out: 12-19)"
    base: haiku_ts_order
    targets: "12-19"
  grids_noclose:
    label: "Random grids without the shortest-path feature `closer`"
    base: haiku_ts_order_noclose
    targets: "12-19"
  families:
    label: "Gridworld families (trained on three 6x6-8x8 members of a family, held out: 10x10-14x14 members)"
    base: haiku_fam_order
    targets: "16-35,76-95,136-155"
    groups: {rooms: "16-35", crossing: "76-95", adjacent: "136-155"}
    source_groups: {"0": rooms, "1": crossing, "2": adjacent}
  pacman:
    label: "Pac-Man (trained on horizons 14, 16, 18; 6 held out: 8, 10, 12, 20, 25, 30)"
    base: haiku_mi_pacman_long
    targets: "0-7,9"                   # ids 3-5 are the training members, left out by the metrics; id 8 (horizon 5) is
                                       # out: every policy gets 0.5511 there (the bare model's min equals its max)
    dataset: pacman_transfer.csv
  mer:
    label: "Mars Exploration Rovers (trained on x = 0.01, 0.05, 0.13 at n = 10; 6 held out: x = 0.03, 0.08, 0.21, 0.34; n = 1, 20)"
    base: haiku_mi_mer
    targets: "0-8"                     # ids 0-2 are the training members, left out by the metrics; 9-11 are sealed
    dataset: mer_transfer.csv
  mer_n:
    label: "Mars Exploration Rovers across n (x = 0.89; trained on n = 1, 2, 3; 6 held out: n = 4, 5, 6, 8, 10, 15)"
    base: haiku_mi_mer_n
    targets: "0-8"                     # ids 0-2 are the training members; 9-11 (n = 20, 50, 100) are sealed
    dataset: mer_n_transfer.csv

cells:
  - name: "Ours, Haiku 5.5"
    code: Haiku
    method: "Ours (Haiku 5.5)"
  - name: "Ours, Sonnet 5.5"
    code: Sonnet
    method: "Ours (Sonnet 5.5)"
    condition: {grids: sonnet5_5_ts_order, grids_noclose: sonnet5_5_ts_order_noclose, families: sonnet5_5_fam_order,
                pacman: sonnet5_5_mi_pacman_long, mer: sonnet5_5_mi_mer, mer_n: sonnet5_5_mi_mer_n}
    repeats: 3
    launch: false                      # Sonnet runs need Asher's go-ahead
  - name: "Ours, Haiku 5.5, family prompt, failure feedback and pick"   # the clean-slate method, ported (Oct 16)
    code: "Haiku pick"
    method: "Ours (Haiku 5.5)"
    condition: {grids: port_ts, grids_noclose: port_ts_noclose, families: port_fam, pacman: port_pacman,
                mer: port_mer, mer_n: port_mer_n}
    rules: determinized                # its lists keep `any`: certified with the order the pick chose on training;
                                       # ties open = the lists as kept
    repeats: 3
    launch: false                      # launched one job at a time with src/run_search.py
  - name: "Ours, Haiku 5.5, verifier narrowing"
    code: "Haiku narrow"
    method: "Ours (Haiku 5.5)"
    condition: {pacman: haiku_pac_narrow_plain}
    repeats: 5
    launch: false

baselines:                             # configs/baselines/*.yaml; ties: false = one action per state (nothing to open)
  - name: "1-2-3-Go! (reimplemented: trees over raw variables)"
    code: "123Go raw"
    method: "1-2-3-Go! (reimplemented)"
    ties: false
    config: {grids: configs/baselines/tree_raw_grid_large.yaml, families: configs/baselines/tree_raw_families.yaml,
             pacman: configs/baselines/pacman_tree_raw.yaml, mer: configs/baselines/mer_tree_raw.yaml,
             mer_n: configs/baselines/mer_n_tree_raw.yaml}
    sources:
      grids: [tree_raw_set0, tree_raw_set1, tree_raw_set2, tree_raw_set3]
      families: {rooms: [tree_raw_set0], crossing: [tree_raw_set1], adjacent: [tree_raw_set2]}
      pacman: [tree_raw_h14_18]          # trained on our training horizons
      mer: [tree_raw_x_train]            # trained on our training instances
      mer_n: [tree_raw_n1_3]
  - name: "1-2-3-Go! trained on horizon 5 (as the paper)"
    code: "123Go h5"
    method: "1-2-3-Go! (reimplemented)"
    ties: false
    config: {pacman: configs/baselines/pacman_tree_raw.yaml}
    sources:
      pacman: [tree_raw_h5]
  - name: "1-2-3-Go! trained on n = 1 (as the paper)"
    code: "123Go n1"
    method: "1-2-3-Go! (reimplemented)"
    ties: false
    config: {mer: configs/baselines/mer_tree_raw.yaml, mer_n: configs/baselines/mer_n_tree_raw.yaml}
    sources:
      mer: [tree_raw_n1]
      mer_n: [tree_raw_n1]
  - name: "1-2-3-Go! with our features"
    code: "123Go feat"
    method: "1-2-3-Go! (reimplemented)"
    ties: false
    config: {grids: configs/baselines/tree_features_grid_large.yaml,
             grids_noclose: configs/baselines/tree_features_noclose_grid_large.yaml,
             families: configs/baselines/tree_features_families.yaml,
             pacman: configs/baselines/pacman_tree_features.yaml, mer: configs/baselines/mer_tree_features.yaml,
             mer_n: configs/baselines/mer_n_tree_features.yaml}
    sources:
      grids: [tree_features_set0, tree_features_set1, tree_features_set2, tree_features_set3]
      grids_noclose: [tree_features_set0, tree_features_set1, tree_features_set2, tree_features_set3]
      families: {rooms: [tree_features_set0], crossing: [tree_features_set1], adjacent: [tree_features_set2]}
      pacman: [tree_features_h14_18]
      mer: [tree_features_x_train]
      mer_n: [tree_features_n1_3]
  - name: "1-2-3-Go! with our features, trained on horizon 5"
    code: "123Go feat h5"
    method: "1-2-3-Go! (reimplemented)"
    ties: false
    config: {pacman: configs/baselines/pacman_tree_features.yaml}
    sources:
      pacman: [tree_features_h5]
  - name: "1-2-3-Go! with our features and positions"   # as our narrowed Pac-Man lists, which may name places
    code: "123Go feat+pos"
    method: "1-2-3-Go! (reimplemented)"
    ties: false
    config: {pacman: configs/baselines/pacman_tree_features_pos.yaml}
    sources:
      pacman: [tree_features_h14_18]
  - name: "Rule-list search"
    code: Search
    method: "Rule-list search"
    config: {grids: configs/baselines/search_grid_large.yaml,
             grids_noclose: configs/baselines/search_noclose_grid_large.yaml,
             families: configs/baselines/search_families.yaml}
    sources:
      grids: [search_set0, search_set1, search_set2, search_set3]
      grids_noclose: [set0, set1, set2, set3]
      families: {rooms: [set0], crossing: [set1], adjacent: [set2]}
  - name: "PPO with our features"
    code: "PPO feat"
    method: "PPO"
    ties: false
    config: {grids: configs/baselines/ppo_features_grid_large.yaml, families: configs/baselines/ppo_features_families.yaml,
             pacman: configs/baselines/pacman_ppo_features.yaml, mer: configs/baselines/mer_ppo_features.yaml,
             mer_n: configs/baselines/mer_n_ppo_features.yaml}
    sources:
      grids: [ppo_features_set0, ppo_features_set1, ppo_features_set2, ppo_features_set3]
      families: {rooms: [ppo_features_set0], crossing: [ppo_features_set1], adjacent: [ppo_features_set2]}
      pacman: [ppo_features_seed0, ppo_features_seed1, ppo_features_seed2]   # three seeds, one training set
      mer: [ppo_features_seed0, ppo_features_seed1, ppo_features_seed2]
      mer_n: [ppo_features_seed0, ppo_features_seed1, ppo_features_seed2]
  - name: "PPO over raw variables"
    code: "PPO raw"
    method: "PPO"
    ties: false
    config: {pacman: configs/baselines/pacman_ppo_raw.yaml, mer: configs/baselines/mer_ppo_raw.yaml,
             mer_n: configs/baselines/mer_n_ppo_raw.yaml}
    sources:
      pacman: [ppo_raw_seed0, ppo_raw_seed1, ppo_raw_seed2]
      mer: [ppo_raw_seed0, ppo_raw_seed1, ppo_raw_seed2]
      mer_n: [ppo_raw_seed0, ppo_raw_seed1, ppo_raw_seed2]
  - name: "PPO with our features and positions"        # as our narrowed Pac-Man lists, which may name places
    code: "PPO feat+pos"
    method: "PPO"
    ties: false
    config: {pacman: configs/baselines/pacman_ppo_features_pos.yaml}
    sources:
      pacman: [ppo_features_seed0, ppo_features_seed1, ppo_features_seed2]
  - name: "PPO with a MiniGrid-style local view"
    code: "PPO view"
    method: "PPO"
    ties: false
    config: {grids: configs/baselines/ppo_view_grid_large.yaml, families: configs/baselines/ppo_view_families.yaml}
    sources:
      grids: [ppo_view_set0, ppo_view_set1, ppo_view_set2, ppo_view_set3]
      families: {rooms: [ppo_view_set0], crossing: [ppo_view_set1], adjacent: [ppo_view_set2]}
  - name: "Hand-written template"
    code: Template
    method: "Hand-written template"
    ties: false                        # compiled per cell
    config: {grids: configs/baselines/template_grid_large.yaml, grids_noclose: configs/baselines/template_grid_large.yaml,
             families: configs/baselines/template_families_v0.yaml}
    sources:
      grids: [cautious]
      grids_noclose: [cautious]
      families: {rooms: [cautious], crossing: [cautious], adjacent: [cautious]}
  - name: "Uniform random policy"
    code: Uniform
    method: "Uniform random policy"
    ties: false
    config: {pacman: configs/baselines/pacman_uniform.yaml, mer: configs/baselines/mer_uniform.yaml,
             mer_n: configs/baselines/mer_n_uniform.yaml}
    sources:
      pacman: [uniform]
      mer: [uniform]
      mer_n: [uniform]
  - name: "Best of 1000 random policies"
    code: "Random"
    method: "Best of 1000 random policies"
    ties: false
    config: {pacman: configs/baselines/pacman_random_policies.yaml, mer: configs/baselines/mer_random_policies.yaml,
             mer_n: configs/baselines/mer_n_random_policies.yaml}
    sources:
      pacman: [random_best_of_1000]
      mer: [random_best_of_1000]
      mer_n: [random_best_of_1000]
  - name: "Strategy of horizon 18, by moves made"
    code: "One steps"
    method: "Strategy of one instance"
    ties: false
    config: {pacman: configs/baselines/pacman_one_instance.yaml}
    sources:
      pacman: [one_instance_steps]
  - name: "Strategy of horizon 18, by moves left"
    code: "One left"
    method: "Strategy of one instance"
    ties: false
    config: {pacman: configs/baselines/pacman_one_instance.yaml}
    sources:
      pacman: [one_instance_moves_left]
  - name: "Strategy of x = 0.13"
    code: "One x0.13"
    method: "Strategy of one instance"
    ties: false
    config: {mer: configs/baselines/mer_one_instance.yaml}
    sources:
      mer: [one_instance]
  - name: "Strategy of n = 3, by requests made (k)"
    code: "One n3 k"
    method: "Strategy of one instance"
    ties: false
    config: {mer_n: configs/baselines/mer_n_one_instance.yaml}
    sources:
      mer_n: [one_instance_k]
  - name: "Strategy of n = 3, by requests left"
    code: "One n3 left"
    method: "Strategy of one instance"
    ties: false
    config: {mer_n: configs/baselines/mer_n_one_instance.yaml}
    sources:
      mer_n: [one_instance_left]
  - name: "Hand-written maze rules"    # over the maze-distance features closer_g0/g1, which our Pac-Man runs do not see
    code: Maze
    method: "Hand-written maze rules"
    config: {pacman: configs/baselines/pacman_maze_rules.yaml}
    sources:
      pacman: [flee_both_any, flee_maze_any]

horizon_figure:                        # Pac-Man's headline (DECISIONS.md): worst-case crash probability against the horizon
  benchmark: pacman
  methods: ["Ours (Haiku 5.5)", "1-2-3-Go! (reimplemented)", "PPO"]   # Asher's decision 2; the others are in the table
  value: crash                         # the transfer CSVs' worst_crash
  horizon: max_steps                   # the target dataset's horizon column
  optimum: 0.5511                      # at every horizon
  threshold: 0.56
  max_horizon: 30
  why_max: "horizons 50 and 100 are Pac-Man's sealed test set and stay out until the test pass (200: PRISM cannot build it)."
  published:
    label: "1-2-3-Go! (published, different setup)"
    points: {5: 0.5511, 25: 0.869, 200: 0.99998}
