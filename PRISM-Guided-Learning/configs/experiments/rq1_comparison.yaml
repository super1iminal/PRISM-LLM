# RQ1: how do LLM-written rule lists, refined with the verifier's feedback, compare with the baselines on held-out
# instances? Our best configuration per benchmark against each baseline's best configuration. These cells are the
# core runs (out/results/core/). Validation targets only; the sealed test set stays sealed until Asher says so.
#   python src/run_experiment.py configs/experiments/rq1_comparison.yaml [--check] [--baselines]
kind: comparison
title: "RQ1: LLM-written rule lists against the baselines (validation)"
question: >
  How many held-out instances does one frozen rule list certify, per method, and how many does a library of a run's
  lists cover? Our cells use the core configuration (the verifier resolves `any` into the best action order on the
  training members each round, no restarts, the generality instruction).
repeats: 5
prices:                                # $ per M prompt tokens, $ per M output tokens
  anthropic/claude-haiku-5.5: [0.10, 0.50]
  anthropic/claude-sonnet-5.5: [3.00, 15.00]

benchmarks:
  grids:
    label: "Random grids (grid_20_large; trained on sets of three 9x9-13x13 grids, held out: 12-19)"
    base: haiku_ts_order
    targets: "12-19"
  grids_noclose:
    label: "Random grids without the shortest-path feature `closer`"
    base: haiku_ts_order_noclose
    targets: "12-19"
  families:
    label: "Gridworld families (trained on three 6x6-8x8 members of a family, held out: 10x10-14x14 members)"
    base: haiku_fam_order
    targets: "16-35,76-95,136-155"
    groups: {rooms: "16-35", crossing: "76-95", adjacent: "136-155"}
    source_groups: {"0": rooms, "1": crossing, "2": adjacent}
  pacman:
    label: "Pac-Man (trained on horizons 14, 16, 18; held out: 8, 10, 12, 20, 25)"
    base: haiku_mi_pacman_long
    targets: "0-7"
    dataset: pacman_transfer.csv

cells:
  - name: "Ours, Haiku 5.5"
    code: Haiku
  - name: "Ours, Sonnet 5.5"
    code: Sonnet
    only: [grids, families]
    condition: {grids: sonnet5_5_ts_order, families: sonnet5_5_fam_order}
    repeats: 3
    launch: false                      # Sonnet runs need Asher's go-ahead

baselines:                             # configs/baselines/*.yaml; ties: false = one action per state (nothing to open)
  - name: "1-2-3-Go! (reimplemented: trees over raw variables)"
    code: "123Go raw"
    ties: false
    config: {grids: configs/baselines/tree_raw_grid_large.yaml, families: configs/baselines/tree_raw_families.yaml}
    sources:
      grids: [tree_raw_set0, tree_raw_set1, tree_raw_set2, tree_raw_set3]
      families: {rooms: [tree_raw_set0], crossing: [tree_raw_set1], adjacent: [tree_raw_set2]}
  - name: "1-2-3-Go! with our features"
    code: "123Go feat"
    ties: false
    config: {grids: configs/baselines/tree_features_grid_large.yaml,
             grids_noclose: configs/baselines/tree_features_noclose_grid_large.yaml,
             families: configs/baselines/tree_features_families.yaml}
    sources:
      grids: [tree_features_set0, tree_features_set1, tree_features_set2, tree_features_set3]
      grids_noclose: [tree_features_set0, tree_features_set1, tree_features_set2, tree_features_set3]
      families: {rooms: [tree_features_set0], crossing: [tree_features_set1], adjacent: [tree_features_set2]}
  - name: "Rule-list search"
    code: Search
    config: {grids: configs/baselines/search_grid_large.yaml,
             grids_noclose: configs/baselines/search_noclose_grid_large.yaml,
             families: configs/baselines/search_families.yaml}
    sources:
      grids: [search_set0, search_set1, search_set2, search_set3]
      grids_noclose: [set0, set1, set2, set3]
      families: {rooms: [set0], crossing: [set1], adjacent: [set2]}
  - name: "PPO with our features"
    code: PPO
    ties: false
    config: {grids: configs/baselines/ppo_features_grid_large.yaml, families: configs/baselines/ppo_features_families.yaml}
    sources:
      grids: [ppo_features_set0, ppo_features_set1, ppo_features_set2, ppo_features_set3]
      families: {rooms: [ppo_features_set0], crossing: [ppo_features_set1], adjacent: [ppo_features_set2]}
  - name: "Hand-written template"
    code: Template
    ties: false                        # compiled per cell
    config: {grids: configs/baselines/template_grid_large.yaml, grids_noclose: configs/baselines/template_grid_large.yaml,
             families: configs/baselines/template_families_v0.yaml}
    sources:
      grids: [cautious]
      grids_noclose: [cautious]
      families: {rooms: [cautious], crossing: [cautious], adjacent: [cautious]}
  - name: "Hand-written maze rules"
    code: Maze
    config: {pacman: configs/baselines/pacman_maze_rules.yaml}
    sources:
      pacman: [flee_both_any, flee_maze_any]
