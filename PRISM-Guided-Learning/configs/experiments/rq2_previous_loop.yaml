# RQ2: the loop rebuilt on Oct 16 (the core configuration, RQ1) against the previous loop, which was the core until then
# (one chain of five rounds, feedback on the worst member, the verifier choosing `any`'s action order every round,
# instance constants allowed), with Haiku 5.5 and with Sonnet 5.5, and against the new loop before its gridworld
# feedback fix (port_ts, port_fam: entering the next goal in its turn read as the failure). Existing runs only.
#   python src/run_experiment.py configs/experiments/rq2_previous_loop.yaml
kind: ablation
title: "RQ2: the new loop against the previous one"
question: >
  How much of the transfer comes from the rebuilt loop rather than the model? The previous loop with Haiku 5.5 and with
  Sonnet 5.5, against the new loop with Haiku 5.5; and how much the gridworld feedback fix adds.
repeats: 3
reference: "New loop (core)"
prices:
  anthropic/claude-haiku-5.5: [0.10, 0.50]
  anthropic/claude-sonnet-5.5: [3.00, 15.00]
benchmarks:
  grids:
    label: "Random grids"
    base: port_ts_history
    targets: "12-19"
  grids_noclose:
    label: "Random grids without `closer`"
    base: port_ts_noclose
    targets: "12-19"
  families:
    label: "Gridworld families"
    base: port_fam_history
    targets: "16-35,76-95,136-155"
    groups: {rooms: "16-35", crossing: "76-95", adjacent: "136-155"}
    source_groups: {"0": rooms, "1": crossing, "2": adjacent}
  pacman:
    label: "Pac-Man (trained on horizons 14, 16, 18; 6 held out: 8, 10, 12, 20, 25, 30)"
    base: port_pacman_narrow_core
    targets: "0-7,9"
    dataset: pacman_transfer.csv
  mer:
    label: "Mars Exploration Rovers across x"
    base: port_mer
    targets: "0-8"
    dataset: mer_transfer.csv
  mer_n:
    label: "Mars Exploration Rovers across n"
    base: port_mer_n
    targets: "0-8"
    dataset: mer_n_transfer.csv
cells:
  - name: "New loop (core)"
    code: New
    rules: {"*": determinized, pacman: final}
    launch: false
  - name: "New loop before the feedback fix"
    code: "New unfixed"
    condition: {grids: port_ts, families: port_fam}
    rules: {"*": determinized}
    launch: false
  - name: "Previous loop, Haiku 5.5"
    code: Prev
    condition: {grids: haiku_ts_order, grids_noclose: haiku_ts_order_noclose, families: haiku_fam_order,
                pacman: haiku_mi_pacman_long, mer: haiku_mi_mer, mer_n: haiku_mi_mer_n}
    repeats: 5
    launch: false
  - name: "Previous loop, Sonnet 5.5"
    code: "Prev Sonnet"
    condition: {grids: sonnet5_5_ts_order, grids_noclose: sonnet5_5_ts_order_noclose, families: sonnet5_5_fam_order,
                pacman: sonnet5_5_mi_pacman_long, mer: sonnet5_5_mi_mer, mer_n: sonnet5_5_mi_mer_n}
    launch: false
