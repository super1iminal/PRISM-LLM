# RQ2: the gridworld feedback fix of Oct 17 (feedback.history, feedback.words, prompt.compact, the strategy hint):
# the core loop (port_ts_history, port_fam_history) against the same loop before it (port_ts, port_fam: entering the
# next goal in its turn read as the failure). Existing runs only.
#   python src/run_experiment.py configs/experiments/rq2_feedback_fix.yaml
kind: ablation
title: "RQ2: the gridworld feedback fix"
question: >
  How much does reading the sequence requirements by the goal flags add on the gridworld benchmarks? The core loop
  against the same loop before the fix, with Haiku 5.5.
repeats: 3
reference: "Core loop"
prices:
  anthropic/claude-haiku-5.5: [0.10, 0.50]
benchmarks:
  grids:
    label: "Random grids"
    base: port_ts_history
    targets: "12-19"
  families:
    label: "Gridworld families"
    base: port_fam_history
    targets: "16-35,76-95,136-155"
    groups: {rooms: "16-35", crossing: "76-95", adjacent: "136-155"}
    source_groups: {"0": rooms, "1": crossing, "2": adjacent}
cells:
  - name: "Core loop"
    code: Core
    rules: determinized
    launch: false
  - name: "Before the feedback fix"
    code: Unfixed
    condition: {grids: port_ts, families: port_fam}
    rules: determinized
    launch: false
