# Transfer check (src/transfer.py): each instance's frozen final rules from a run, certified on every instance of a
# dataset. Schema: TransferConfig in src/transfer.py; docs/config.md.
# Override with --set key=value (or the --workers shortcut), or pass another file with --config.

workers: 4                    # target instances checked in parallel (each runs its own PRISM processes)
exact_near: 0.03              # re-check with the exact solvers when a worst case is this close to its threshold (0: never)
