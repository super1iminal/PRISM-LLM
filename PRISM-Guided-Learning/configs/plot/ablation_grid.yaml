# docs/ablation_run.png and docs/ablation_not_run.png: the ablation design (conditions x factors).
# Run: python viz/plot_ablation_grid.py configs/plot/ablation_grid.yaml   (paths relative to PRISM-Guided-Learning/)
# The rows themselves are in viz/plot_ablation_grid.py. Seeds, grids, rounds and model come from
# configs/ablation/ and configs/run/.

script: plot_ablation_grid
gpu_hours:                    # per 20-grid run with 2 workers
  symbolic: 1.0               # measured with the obstacle visible (B2, R1, R2)
  legacy: 1.15                # measured with the obstacle hidden
  legacy_visible: 4.5         # estimate: legacy writes one action per (cell, obstacle phase); mean cycle 3.9
families_from: configs/plot/ablation_summary.yaml   # each condition's family (badge colour)
out_run: ../docs/ablation_run.png
out_not_run: ../docs/ablation_not_run.png
