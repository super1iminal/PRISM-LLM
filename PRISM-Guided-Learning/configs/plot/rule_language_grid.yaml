# out/results/rule_language_grid/: Haiku 5.5 on grid_20_large with the base rule vocabulary (haiku_large_R4, 2 runs)
# against the extended, general vocabulary: feature sets v1 and v2, each without and with the shortest-path
# feature (one run each).
# Run: python viz/ablation_summary.py configs/plot/rule_language_grid.yaml   (paths relative to PRISM-Guided-Learning/)

script: ablation_summary
root: out/results/ablations   # reads <root>/<condition>/seed_<k>/
out: out/results/rule_language_grid
heading: "Rule language on grid_20_large (Haiku 5.5)"

conditions:
  haiku_large_R4: {family: Baselines, reference: null, change: "Base vocabulary (coordinates)"}
  haiku_rl_grid_large: {family: Rule vocabulary, reference: haiku_large_R4, change: "General v1: constants, wall/hazard/toward, any"}
  haiku_rl_grid_large_closer: {family: Rule vocabulary, reference: haiku_large_R4, change: "General v1 + shortest-path feature closer"}
  haiku_rl2_grid_large: {family: Rule vocabulary, reference: haiku_large_R4, change: "General v2: v1 + obstacle, risky"}
  haiku_rl2_grid_large_closer: {family: Rule vocabulary, reference: haiku_large_R4, change: "General v2 + closer"}

reference_lines: {haiku_large_R4: "--"}

budget_groups:
  Rule vocabulary: [haiku_large_R4, haiku_rl_grid_large, haiku_rl_grid_large_closer, haiku_rl2_grid_large,
                    haiku_rl2_grid_large_closer]

cost: {label: "USD at Haiku 5.5 prices", input: 1.0e-7, output: 5.0e-7}
planned: []

uuv: null

title: "Haiku 5.5 on {grids} large gridworlds: base vs general rule vocabulary, bars = mean over runs"
intro: >-
  Gridworld, {grids} grids of sizes 9 to 13 ({solvable} solvable), {model}, thinking on, restart on slow progress,
  obstacle phase visible. The base vocabulary has 2 runs; each general-vocabulary condition is one unseeded run, so
  the paired tests are exploratory. General vocabulary: instance constants (grid size, goal coordinates), per-action
  features (v1: wall, hazard, toward; v2 adds obstacle and risky; closer where named), rules with action `any`, and no
  numbers but 0 and 1. Five general-vocabulary grids (v1: 14, 18; v2: 9, 19; v2 + closer: 19) ended with an error
  because a PRISM timeout did not take effect (fixed since; DECISIONS.md): they count as unsolved, and are left out
  of the means and the paired tests.
