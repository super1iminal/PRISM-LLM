# viz/figures/budget_tokens_qwen.png: requirements met against tokens spent (Marsha, Oct 8: pure resampling's curve on
# the same plot as the feedback loop, tokens on the x axis). qwen3:14b ablation runs, 2 seeds each, grid_20_balanced.
# Each point is a round budget k at the mean tokens spent through round k.
# Run: python viz/plot_budget.py configs/plot/budget_tokens_qwen.yaml   (paths relative to PRISM-Guided-Learning/)

script: plot_budget
runs:                     # label -> run dir, or a condition dir whose seed_* runs are pooled
  Restart after 2 stalls (B2): out/results/ablations/B2
  Restart on slow progress, the default (R4): out/results/ablations/R4
  Pure resampling (R5): out/results/ablations/R5
max_k: null               # rounds budget axis; null = the largest round budget among the runs
cost: {label: "tokens, input + output", input: 1, output: 1}   # null: x = rounds budget k
out: viz/figures/budget_tokens_qwen.png   # also writes <out>.csv
