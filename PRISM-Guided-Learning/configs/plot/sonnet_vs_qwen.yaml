# out/results/sonnet_vs_qwen/: Claude Sonnet 5, Sonnet 5.5 and Haiku 5.5 against the qwen3:14b runs R4 and B2, on one page
# (SUMMARY.md, conditions/costs/budget/mechanics.png).
# Run: python viz/ablation_summary.py configs/plot/sonnet_vs_qwen.yaml   (paths relative to PRISM-Guided-Learning/)
# The runs' settings are in configs/run/conditions/ (sonnet5, sonnet5_5, haiku5_5, R4, B2); keys as in ablation_summary.yaml.

script: ablation_summary
root: out/results/ablations   # reads <root>/<condition>/seed_<k>/
out: out/results/sonnet_vs_qwen
heading: "Claude vs qwen"

conditions:
  B2: {family: Baselines, reference: null, change: "qwen3:14b, restart after 2 stalls"}
  R4: {family: Retry sweep, reference: B2, change: "qwen3:14b, restart on slow progress (the default)"}
  sonnet5: {family: Model, reference: R4, change: "Claude Sonnet 5, thinking off, R4's settings"}
  sonnet5_5: {family: Model, reference: R4, change: "Claude Sonnet 5.5, thinking on, R4's settings"}
  haiku5_5: {family: Model, reference: R4, change: "Claude Haiku 5.5, sonnet5_5's settings"}

reference_lines: {R4: "--"}

budget_groups:
  Claude vs qwen: [B2, R4, sonnet5, sonnet5_5, haiku5_5]

cost: null                    # tokenizers differ between the models, so no spend axis
planned: []

uuv: null

title: "Claude vs qwen3:14b on {grids} gridworlds ({rounds} rounds, obstacle visible), bars = mean over seeds"
intro: >-
  Gridworld, {grids} grids ({solvable} solvable), {rounds} rounds, obstacle phase visible to the rules. Models:
  {model}. The qwen conditions have 2 seeds each (local Ollama, q4_K_M, thinking off). Each Claude condition is one
  unseeded run on OpenRouter, Anthropic's endpoint (no Claude endpoint accepts a seed): Sonnet 5 with thinking off,
  Sonnet 5.5 with thinking on (its endpoints refuse to turn it off) and a 16k output cap, Haiku 5.5 with Sonnet 5.5's
  settings. Symbolic numbers are worst
  case; the Claude runs report the exact check's values (interval iteration), the qwen runs the loop's. Paired tests
  compare per-grid means against R4 with a sign-flip permutation test; with one Claude run per grid, treat p > 0.05
  as noise.
