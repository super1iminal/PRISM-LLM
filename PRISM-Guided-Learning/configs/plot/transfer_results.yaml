# viz/figures/transfer_*.png: the transfer-search results so far (docs/transfer_plan.md).
# Run: python viz/plot_transfer_results.py configs/plot/transfer_results.yaml   (paths relative to PRISM-Guided-Learning/)
# A method is an LLM `condition` (its runs), a baseline `csv` with its `sources`, or `values` from the numpy model
# (hatched: PRISM certification pending; replace with the baseline's CSV once certified). `ours: true` draws it blue.
script: plot_transfer_results
out_dir: viz/figures

grid:
  title: "Random grids: frozen rules certified on held-out 12x12 and 13x13 grids"
  dataset: grid_20_large.csv
  targets: "12-19"
  note: "Best configuration of each method (all with the shortest-path feature). Whiskers: range over training sets. Hatched: numpy model, PRISM check pending."
  panels:
    "":
      - {label: "1-2-3-Go! (reimplemented)", values: [0, 0, 0, 0]}
      - {label: "1-2-3-Go! with our features", values: [7, 3, 3, 3]}
      - {label: "Rule-list search", csv: out/results/baselines/search_grid_large/transfer_grid_20_large.csv,
         sources: [search_set0, search_set1, search_set2, search_set3]}
      - {label: "PPO with our features", values: [4, 7, 5, 6]}
      - {label: "Hand-written template", csv: out/results/baselines/template_grid_large/transfer_grid_20_large.csv,
         sources: [cautious]}
      - {label: "Ours (Sonnet 5.5, 1 run)", condition: sonnet5_5_ts_order, ours: true, strong: true}

families:
  title: "Gridworld families: trained on 6x6-8x8 members, certified on 10x10-14x14 members"
  dataset: families_v0.csv
  targets: "16-35,76-95,136-155"
  groups: {rooms: "16-35", crossing: "76-95", adjacent: "136-155"}
  source_groups: {"0": rooms, "1": crossing, "2": adjacent}
  note: "Best configuration of each method; all PRISM-certified. PPO: policy network over our features, 2M steps per family."
  methods:
    - {label: "Hand-written template", csv: out/results/baselines/template_families_v0/transfer_families_v0.csv,
       sources: {rooms: [cautious], crossing: [cautious], adjacent: [cautious]}}
    - {label: "1-2-3-Go! (reimplemented)", csv: out/results/baselines/tree_raw_families/transfer_families_v0.csv,
       sources: {rooms: [tree_raw_set0], crossing: [tree_raw_set1], adjacent: [tree_raw_set2]}}
    - {label: "1-2-3-Go! with our features", csv: out/results/baselines/tree_features_families/transfer_families_v0.csv,
       sources: {rooms: [tree_features_set0], crossing: [tree_features_set1], adjacent: [tree_features_set2]}}
    - {label: "Rule-list search", csv: out/results/baselines/search_families/transfer_families_v0.csv,
       sources: {rooms: [set0], crossing: [set1], adjacent: [set2]}}
    - {label: "PPO with our features", csv: out/results/baselines/ppo_features_families/transfer_families_v0.csv,
       sources: {rooms: [ppo_features_set0], crossing: [ppo_features_set1], adjacent: [ppo_features_set2]}}
    - {label: "Ours (Sonnet 5.5, 1 run)", condition: sonnet5_5_fam_order, ours: true, strong: true}

pacman:
  title: "Pac-Man: frozen rules on longer games than they were trained on"
  horizons: [8, 10, 12, 14, 16, 18, 20, 25]   # pacman_transfer.csv ids 0-7
  optimum: 0.5511
  threshold: 0.56
  series:
    - {label: "Ours (Haiku 5.5, trained on 14, 16, 18)", csv: out/results/core/haiku_mi_pacman_long/seed_none_1/transfer_pacman_transfer.csv, source: 0}
  published:
    - {horizon: 25, value: 0.869, label: "1-2-3-Go! (published)"}

ablations:
  title: "What makes the rules transfer (Haiku 5.5, random grids, with closer)"
  dataset: grid_20_large.csv
  targets: "12-19"
  xmin: 3
  highlight: "The verifier resolves the LLM's choices"
  groups:
    "Prompting and feedback":
      - {label: "Multi-instance training (reference)", condition: haiku_mi_grid_large_closer}
      - {label: "+ certified on unseen, larger instances", condition: haiku_ts_generality}
      - {label: "+ strategy in words first", condition: haiku_ts_strategy}
      - {label: "+ explain how any is resolved", condition: haiku_ts_tiebreak}
      - {label: "+ instruction, no restarts", condition: haiku_ts_norestart}
      - {label: "+ feedback in feature space", condition: haiku_ts_features}
      - {label: "+ hint to wait at walls", condition: haiku_ts_hint_wait}
    "Training sets":
      - {label: "Sets one generic list can solve", condition: haiku_ts_sets_solvable}
      - {label: "One set of all 12 grids", condition: haiku_ts_all12}
    "The verifier resolves the LLM's choices":
      - {label: "Best order chosen each round (ours)", condition: haiku_ts_order}
      - {label: "Fixed declared order", condition: haiku_ts_declared}
      - {label: "Best order only reported", condition: haiku_ts_report}
    "More from the verifier":
      - {label: "Hidden training members", condition: haiku_ts_hidden}
      - {label: "Failing traces in the feedback", condition: haiku_ts_trace}
      - {label: "Counterexample-driven training sets (8 rounds)", condition: haiku_ts_grow}
      - {label: "8 rounds (control)", condition: haiku_ts_order_r8}
