# viz/figures/transfer_mi_grid.png: rule sets trained on three grids at once (run.train_sets: a 9x9, a 10x10 and an
# 11x11 each), frozen and certified on all 20 grids of grid_20_large (DECISIONS.md, "Multi-instance training").
# Run: python viz/plot_transfer.py configs/plot/transfer_mi_grid.yaml   (paths relative to PRISM-Guided-Learning/)
# Each run needs <run>/transfer_<dataset stem>.csv from src/transfer.py.

script: plot_transfer
runs:                                  # panel title -> run dir
  "Haiku 5.5, general vocabulary": out/results/ablations/haiku_mi_grid_large/seed_none_1
  "Haiku 5.5, general vocabulary + closer": out/results/ablations/haiku_mi_grid_large_closer/seed_none_1
  "Sonnet 5.5, general vocabulary": out/results/ablations/sonnet5_5_mi_grid_large/seed_none_1
dataset: grid_20_large.csv
group: n                               # instance field grouping the ticks (grid size); null: instance ids
group_label: "{v}x{v}"
title: "Rules trained on three grids at once, frozen and certified on every grid (grid_20_large)"
out: viz/figures/transfer_mi_grid.png
