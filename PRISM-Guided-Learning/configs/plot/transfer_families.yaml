# out/results/transfer_search/FAMILIES.md: rule sets trained on each gridworld family's 6x6-8x8 members (seed 0),
# frozen and certified on that family's 10x10-14x14 members (families_v0.csv; docs/transfer_plan.md, Phase 1b).
# Run: python viz/transfer_summary.py configs/plot/transfer_families.yaml   (paths relative to PRISM-Guided-Learning/)
script: transfer_summary
root: null                             # runs: out/results/core or ablations (configs/core.yaml)
dataset: families_v0.csv
targets: "16-35,76-95,136-155"
rules: final
conditions: [haiku_fam_v0, haiku_fam_split, haiku_fam_order]
prices:
  anthropic/claude-haiku-5.5: [0.10, 0.50]
baselines:                             # name -> transfer-format CSV (configs/baselines/*_families.yaml)
  template: out/results/baselines/template_families_v0/transfer_families_v0.csv
  "1-2-3-Go! (reimplemented)": out/results/baselines/tree_raw_families/transfer_families_v0.csv
  "1-2-3-Go! with our features": out/results/baselines/tree_features_families/transfer_families_v0.csv
  rule-list search: out/results/baselines/search_families/transfer_families_v0.csv
groups: {rooms: "16-35", crossing: "76-95", adjacent: "136-155"}
source_groups: {"0": rooms, "1": crossing, "2": adjacent, cautious: "*", tree_raw_set0: rooms, tree_raw_set1: crossing, tree_raw_set2: adjacent,
                tree_features_set0: rooms, tree_features_set1: crossing, tree_features_set2: adjacent, set0: rooms, set1: crossing,
                set2: adjacent}   # sample id or baseline source -> group
title: "Gridworld families: rule sets trained on 6x6-8x8 members, certified on 10x10-14x14 members"
out: out/results/transfer_search/FAMILIES.md
