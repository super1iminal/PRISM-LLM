# viz/figures/transfer_grid.png: frozen general-vocabulary rule sets on all 20 large grids (DECISIONS.md,
# "Gridworld transfer"). Sonnet's rules pass only their own grid; Haiku's with closer pass the same 9 grids.
# Run: python viz/plot_transfer.py configs/plot/transfer_grid.yaml   (paths relative to PRISM-Guided-Learning/)
# Each run needs <run>/transfer_<dataset stem>.csv from src/transfer.py.

script: plot_transfer
runs:                                  # panel title -> run dir
  "Sonnet 5.5, general vocabulary": out/results/ablations/sonnet5_5_rl_grid_large/seed_none_1
  "Haiku 5.5, general vocabulary + closer": out/results/ablations/haiku_rl_grid_large_closer/seed_none_1
dataset: grid_20_large.csv
group: n                               # instance field grouping the ticks (grid size); null: instance ids
group_label: "{v}x{v}"
title: "Rules written for one grid, frozen and certified on every grid (grid_20_large)"
out: viz/figures/transfer_grid.png
