# out/results/archive/transfer_search/SUMMARY.md: the transfer search (docs/experiments.md). Per condition: training sets
# solved, held-out targets certified per frozen rule set, requirements met there, tokens and dollars per rule set.
# Run: python viz/transfer_summary.py configs/plot/transfer_search.yaml   (paths relative to PRISM-Guided-Learning/)
# Each run needs <run>/transfer_<dataset stem>.csv from src/transfer.py (src/run_search.py runs both).

script: transfer_summary
root: null                             # runs: out/results/core or ablations (the comparison experiments, configs/experiments/)
dataset: grid_20_large.csv             # target dataset of the transfer CSVs
targets: "12-19"                       # held-out targets (the validation grids); trained targets never count
rules: final                           # final rules, or determinized (src/determinize.py: `any` resolved into an order
                                       # chosen on the training instances)
conditions:                            # in table order
  - haiku_mi_grid_large
  - haiku_mi_grid_large_closer
  - sonnet5_5_mi_grid_large
prices:                                # model -> [$ per M prompt tokens, $ per M output tokens]
  anthropic/claude-haiku-5.5: [0.10, 0.50]
  anthropic/claude-sonnet-5.5: [3.0, 15.0]
baselines: {}                          # name -> transfer-format CSV (src/baselines/)
groups: {}                             # group -> target ids, when each rule set is checked on its own group only
source_groups: {}                      # source -> its group
title: "Transfer search: held-out grids 12-19 of grid_20_large"
out: out/results/archive/transfer_search/SUMMARY.md
