# out/results/haiku_large/: the Haiku ablation on grid_20_large (DECISIONS.md, planned Oct 8): restart on slow
# progress (the default), restart after 2 stalls, and pure resampling with 10 rounds, two unseeded runs each.
# Run: python viz/ablation_summary.py configs/plot/haiku_large.yaml   (paths relative to PRISM-Guided-Learning/)
# The runs' settings are in configs/run/conditions/haiku_large_*.yaml; keys as in ablation_summary.yaml.

script: ablation_summary
root: out/results/ablations   # reads <root>/<condition>/seed_<k>/
out: out/results/haiku_large
heading: "Haiku ablation on grid_20_large"

# No per-condition references: the planned comparisons below are the tests. The main table's numbers are each
# run's full budget (10 rounds for pure resampling); the planned comparisons put the conditions on equal footing.
conditions:
  haiku_large_R4: {family: Retry sweep, reference: null, change: "Restart on slow progress (the default)"}
  haiku_large_B2: {family: Baselines, reference: null, change: "Restart after 2 stalls"}
  haiku_large_R5: {family: Rounds budget, reference: null, change: "Pure resampling (no feedback), 10 rounds"}

reference_lines: {haiku_large_R5: "--"}

budget_groups:
  Retry policy: [haiku_large_R4, haiku_large_B2, haiku_large_R5]

# Haiku 5.5's prices on OpenRouter: $0.10 per million input tokens, $0.50 per million output tokens
cost: {label: "USD at Haiku 5.5 prices", input: 1.0e-7, output: 5.0e-7}

# Fixed before the runs (DECISIONS.md, "Haiku ablation on grid_20_large"), Holm-corrected together
planned:
  - {condition: haiku_large_B2, reference: haiku_large_R5, at: "rounds:5"}
  - {condition: haiku_large_R4, reference: haiku_large_R5, at: "rounds:5"}
  - {condition: haiku_large_B2, reference: haiku_large_R5, at: cost}
  - {condition: haiku_large_R4, reference: haiku_large_R5, at: cost}

uuv: null

title: "Haiku 5.5 on {grids} large gridworlds (9x9 to 13x13, obstacle visible), bars = mean over runs"
intro: >-
  Gridworld, {grids} grids of sizes 9 to 13 ({solvable} solvable), {model}, thinking on, obstacle phase visible to the
  rules. Two unseeded runs per condition on OpenRouter, Anthropic's endpoint (no Claude endpoint accepts a seed).
  Symbolic numbers are worst case; the main table reports the exact check's values, the budget curves and planned
  comparisons the loop's (replayed per round). The main table is each condition's full budget: 5 rounds, or 10 for
  pure resampling.
