# out/results/legacy_qwen/: the legacy per-state planner with the obstacle visible (B1, one seed, preliminary)
# against the symbolic loop's default (R4) and restart after 2 stalls (B2), qwen3:14b on grid_20_balanced.
# Run: python viz/ablation_summary.py configs/plot/legacy_qwen.yaml   (paths relative to PRISM-Guided-Learning/)
# Same runs as the ablation summary; keys as in ablation_summary.yaml.

script: ablation_summary
root: out/results/ablations   # reads <root>/<condition>/seed_<k>/
out: out/results/legacy_qwen
heading: "Legacy per-state planner vs the symbolic loop (qwen3:14b)"

# Legacy is the reference: each symbolic condition is tested against it (paired per grid, exploratory)
conditions:
  B1: {family: Legacy variants, reference: null, change: "Legacy per-state (obstacle visible)"}
  R4: {family: Retry sweep, reference: B1, change: "Symbolic, restart on slow progress (the default)"}
  B2: {family: Baselines, reference: B1, change: "Symbolic, restart after 2 stalls"}

reference_lines: {B1: ":"}

budget_groups:
  Legacy vs symbolic: [B1, R4, B2]

cost: {label: "tokens, input + output", input: 1, output: 1}

planned: []

uuv: null

title: "Legacy vs symbolic on {grids} gridworlds ({model}, {rounds} rounds, obstacle visible)"
intro: >-
  Gridworld, {grids} grids ({solvable} solvable), {model}, {rounds} rounds, obstacle phase visible to rules and
  legacy. Legacy has one seed (preliminary; a second seed was not run), the symbolic conditions two. Symbolic
  numbers are worst case; legacy's policy is deterministic, so its best and worst case coincide. The paired tests
  (each symbolic condition against legacy, per grid) are exploratory, not pre-registered. Legacy logs only per-run
  token totals, so it has no spend curve: its whole run averages about 151k tokens per grid, 8x the default loop.
