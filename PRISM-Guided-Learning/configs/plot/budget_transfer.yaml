# out/results/experiments/rq2_feedback/budget_transfer.png: held-out targets certified per list, and training sets
# solved, against the spend per training set, one line per cell (mean over runs, band: range over runs). Data: each
# run's budget_transfer.csv (src/budget_transfer.py). The rq2_feedback report draws it too (its `budget.plot`).
# Run: python viz/plot_budget_transfer.py configs/plot/budget_transfer.yaml   (paths relative to PRISM-Guided-Learning/)

script: plot_budget_transfer
experiment: configs/experiments/rq2_feedback.yaml
cost: dollars             # x axis: dollars | output_tokens | prompt_tokens (per training set)
points: 121               # budgets evaluated between 0 and the largest spend of a benchmark's runs
colors:                   # cell code -> slot of the reference palette (1-3, all pairs distinct); others in grey ink
  F: 1
  R 18: 2
  R: 3
  F more: 1
dashed: [F more, F+R gain]
dotted: [F+R stall]
out: null                 # null: next to the experiment's report
