# viz/figures/grid20.png: legacy vs symbolic, grid by grid (grouped by size when there are many grids).
# Run: python viz/plot_comparison.py configs/plot/grid20.yaml   (paths relative to PRISM-Guided-Learning/)
# The model, dataset and round budget in the figure come from the runs themselves.

script: plot_comparison
legacy: out/results/legacy_grid20
symbolic: out/results/symbolic_grid20_capped
samples: null             # e.g. "0-4" or "0,2,5-7"; null = every sample present in both runs
include_partial: false    # include symbolic samples that did not finish (read from the worker logs)
title: null               # null: "Legacy vs symbolic policies: <model>, <n> gridworlds"
out: viz/figures/grid20.png   # also writes <out>.csv
