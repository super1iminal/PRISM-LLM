# viz/figures/uuv_sonnet.png: UUV final policies of qwen3:14b (U1) and Claude Sonnet 5.5 (U1_sonnet5_5) against the
# domain's reference policies, per scenario and requirement.
# Run: python viz/plot_domain.py configs/plot/uuv_sonnet.yaml   (paths relative to PRISM-Guided-Learning/)
# Runs that recorded a config.json must have used this domain and dataset.

script: plot_domain
domain: uuv
dataset: uuv_paper.csv
symbolic:                 # label -> run dir, at most 3; {} draws the reference policies only
  qwen3:14b (U1, seed 1): out/results/ablations/U1/seed_1
  qwen3:14b (U1, seed 2): out/results/ablations/U1/seed_2
  Claude Sonnet 5.5: out/results/ablations/U1_sonnet5_5/seed_none
title: "UUV: worst-case value of each final policy, qwen3:14b (U1) vs Claude Sonnet 5.5"
out: viz/figures/uuv_sonnet.png   # also writes <out>.md
