# viz/figures/budget_grid20_default.png: requirements met with only k rounds (keep-best after round k), for legacy,
# the symbolic run with the default config, and the R4 seeds (same settings, fixed seeds) as a reference.
# Run: python viz/plot_budget.py configs/plot/budget_grid20_default.yaml   (paths relative to PRISM-Guided-Learning/)

script: plot_budget
runs:                     # label -> run dir, or a condition dir whose seed_* runs are pooled
  Legacy: out/results/legacy_grid20
  Symbolic (default): out/results/symbolic_grid20_default
  R4 (seeds 1-2): out/results/ablations/R4
max_k: null               # rounds budget axis; null = the largest round budget among the runs
out: viz/figures/budget_grid20_default.png   # also writes <out>.csv
