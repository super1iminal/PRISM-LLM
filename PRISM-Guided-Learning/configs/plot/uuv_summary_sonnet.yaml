# viz/figures/uuv_summary_sonnet.png: Claude Sonnet 5.5's UUV policy (U1_sonnet5_5) vs the paper's controller
# (probability, policy size, energy/time).
# Run: python viz/plot_uuv_summary.py configs/plot/uuv_summary_sonnet.yaml   (paths relative to PRISM-Guided-Learning/)
# The rules are re-verified against the domain, so every requirement (energy budget included) is checked.

script: plot_uuv_summary
symbolic: out/results/ablations/U1_sonnet5_5/seed_none   # a UUV run; its final rules, and the model name in the table
dataset: uuv_paper.csv
prism_method: ""                     # PRISM solver for this figure; "" = PRISM's default, as the paper used
                                     # (reproduces its Table 2; Gauss-Seidel lands ~3 higher on Caribbean max energy)
out: viz/figures/uuv_summary_sonnet.png   # also writes <out>.md
