# viz/figures/budget_grid20.png: what each run would have achieved with only k rounds (keep-best after round k).
# Run: python viz/plot_budget.py configs/plot/budget_grid20.yaml   (paths relative to PRISM-Guided-Learning/)

script: plot_budget
runs:                     # label -> run dir, or a condition dir whose seed_* runs are pooled
  Legacy: out/results/legacy_grid20
  Symbolic: out/results/symbolic_grid20_capped
max_k: null               # rounds budget axis; null = the largest round budget among the runs
out: viz/figures/budget_grid20.png   # also writes <out>.csv
