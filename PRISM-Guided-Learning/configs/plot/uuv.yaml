# viz/figures/uuv.png: UUV symbolic runs vs the domain's reference policies, per scenario and requirement.
# Run: python viz/plot_domain.py configs/plot/uuv.yaml   (paths relative to PRISM-Guided-Learning/)
# Runs that recorded a config.json must have used this domain and dataset.

script: plot_domain
domain: uuv
dataset: uuv_paper.csv
symbolic:                 # label -> run dir, at most 3; {} draws the reference policies only
  qwen (symbolic): out/results/symbolic_uuv
title: null               # null: "<domain>: worst-case value of each final policy"
out: viz/figures/uuv.png  # also writes <out>.md
