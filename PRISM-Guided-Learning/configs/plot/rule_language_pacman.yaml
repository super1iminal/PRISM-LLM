# out/results/rule_language_pacman/: Haiku 5.5 on Pac-Man (horizons 8-16) with the base rule vocabulary (haiku_pacman)
# against the extended, general vocabulary (haiku_rl_pacman); one run each.
# Run: python viz/ablation_summary.py configs/plot/rule_language_pacman.yaml   (paths relative to PRISM-Guided-Learning/)

script: ablation_summary
root: out/results/ablations   # reads <root>/<condition>/seed_<k>/
out: out/results/rule_language_pacman
heading: "Rule language on Pac-Man (Haiku 5.5)"

conditions:
  haiku_pacman: {family: Baselines, reference: null, change: "Base vocabulary (positions, headings, steps)"}
  haiku_rl_pacman: {family: Rule vocabulary, reference: haiku_pacman, change: "General: MAXSTEPS, moves_left, wall, nearer_g0/g1, any"}

reference_lines: {haiku_pacman: "--"}

budget_groups:
  Rule vocabulary: [haiku_pacman, haiku_rl_pacman]

cost: {label: "USD at Haiku 5.5 prices", input: 1.0e-7, output: 5.0e-7}
planned: []

uuv: null

title: "Haiku 5.5 on Pac-Man ({grids} horizons): base vs general rule vocabulary"
intro: >-
  Pac-Man (QVBS), horizons 8 to 16, crash probability <= 0.56 (optimum 0.5511), {model}, thinking on, restart on slow
  progress. One unseeded run per condition, so the comparison is exploratory. "Requirements met" is 0 or 1 here.
