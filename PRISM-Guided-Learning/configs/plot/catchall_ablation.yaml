# viz/figures/catchall_ablation.png: legacy vs the symbolic runs with and without the catch-all instruction.
# Run: python viz/plot_runs.py configs/plot/catchall_ablation.yaml   (paths relative to PRISM-Guided-Learning/)
# The model and round budget in the figure come from the runs themselves.

script: plot_runs
legacy: out/results/legacy_grid20
symbolic:                 # label -> run dir, at most 2 (three series stay distinguishable)
  catch-all asked: out/results/symbolic_grid20_capped
  no catch-all: out/results/symbolic_grid20_nocatchall
title: "Catch-all instruction ablation: qwen3:14b, 20 gridworlds, grouped by grid size"   # null: from the runs
out: viz/figures/catchall_ablation.png   # also writes <out>.csv and <out>.md
