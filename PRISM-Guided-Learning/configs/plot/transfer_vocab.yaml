# viz/figures/transfer_vocab.png: the head-to-head on LLM-written vocabulary (first repeat of each). Rule sets
# trained on three grids from 0-11, frozen and certified on all 20 grids of grid_20_large; grids 12-19 are the
# fixed test set. Run: python viz/plot_transfer.py configs/plot/transfer_vocab.yaml
# Each run needs <run>/transfer_grid_20_large.csv from src/transfer.py (all targets).

script: plot_transfer
runs:                                  # panel title -> run dir
  "Haiku 5.5, hand-written features + closer": out/results/ablations/haiku_vocab_baseline/seed_none_1
  "Haiku 5.5, LLM-written features (level 1)": out/results/ablations/haiku_vocab_llm/seed_none_1
dataset: grid_20_large.csv
group: n                               # instance field grouping the ticks (grid size); null: instance ids
group_label: "{v}x{v}"
title: "Hand-written vs LLM-written vocabulary: rules trained on three grids, certified on every grid"
out: viz/figures/transfer_vocab.png
