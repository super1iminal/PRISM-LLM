# out/results/ablations/summary/: every ablation result on one page (SUMMARY.md, conditions/costs/budget/mechanics/uuv.png).
# Run: python viz/ablation_summary.py configs/plot/ablation_summary.yaml   (paths relative to PRISM-Guided-Learning/)
# Grid counts, the model and round budgets come from the runs; the runs' settings are in configs/run/.

script: ablation_summary
root: out/results/ablations   # reads <root>/<condition>/seed_<k>/, writes <root>/summary/

# Conditions in table order. family: colour group (viz/theme.py FAMILY_COLORS); reference: the condition
# it is tested against (paired test per grid); change: what differs, as shown in tables and legends.
conditions:
  B2: {family: Baselines, reference: null, change: "Old defaults (restart after 2 stalls)"}
  R1: {family: Retry sweep, reference: B2, change: "Never restart"}
  R2: {family: Retry sweep, reference: B2, change: "Restart after 1 stall"}
  R3: {family: Retry sweep, reference: B2, change: "Restart every 3rd round"}
  R4: {family: Retry sweep, reference: B2, change: "Restart on slow progress (new default)"}
  R5: {family: Retry sweep, reference: B2, change: "Always restart (no feedback)"}
  D7: {family: Rounds budget, reference: R4, change: "New default, 7 rounds"}
  S1: {family: Feedback content, reference: B2, change: "Results table only"}
  S4: {family: Feedback content, reference: B2, change: "No examples in the prompt"}
  S5: {family: Blame signal, reference: B2, change: "Blame by one-step regret"}
  V1: {family: Blame signal, reference: B2, change: "Blame on random rules/states"}
  V2: {family: Blame signal, reference: B2, change: "No blame section"}
  B1: {family: Baselines, reference: B2, change: "Legacy per-state"}
  L1: {family: Legacy variants, reference: B1, change: "Legacy + restart after 2 stalls"}
  L2: {family: Legacy variants, reference: B1, change: "Legacy without worked examples"}

reference_lines: {B2: "--", B1: ":"}   # drawn across the bar charts (line style); dashed in the budget panels

budget_groups:                # one budget-curve panel per group
  Retry sweep and rounds: [B2, R1, R2, R3, R4, R5, D7, B1]
  Feedback content and blame: [B2, S1, S4, S5, V1, V2]
  Legacy: [B1, L1, L2, B2]

uuv:                          # a UUV condition's runs get their own figure and table; null: none
  condition: U1
  change: "symbolic defaults on the paper's two scenarios, with the energy budget"

# Filled from the runs: {grids}, {solvable}, {model}, {rounds} (most common budget), {seeds}
title: "Ablations on {grids} gridworlds ({model}, {rounds} rounds, obstacle visible), bars = mean over seeds"
intro: >-
  Gridworld, {grids} grids ({solvable} solvable), {model}, {rounds} rounds, obstacle phase visible to rules and
  legacy. Symbolic numbers are worst case. Paired tests compare per-grid means (seeds averaged) against the
  reference with a sign-flip permutation test; with {grids} grids and {seeds} seeds, treat p > 0.05 as noise.
