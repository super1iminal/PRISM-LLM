# Asher's UUV plan, step 5: port_uuv_sets with only `feedback.words: true` added, so the failure feedback names states
# and one-step risks in the domain's words (UUV.state_words, UUV.loss_words: written from the model and spec alone).
domain: {name: uuv, dataset: uuv_family_v0.csv}
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules: {extended: true, general: true, any_order: none, strict: true}
prompt: {generality: true, worst_case: true}
feedback: {horizon: domain, words: true}
planner: {retry: never, feedback: failures, max_rounds: 7, chains: 8, done_margin: 0.0001, branch: per_requirement,
  pick: candidates, pick_top: 6, repair: 25, repair_tries: 40}
run:
  workers: 4
  train_sets:
  - [0, 6, 10]
  - [42, 43, 44]
  - [45, 46, 47]
