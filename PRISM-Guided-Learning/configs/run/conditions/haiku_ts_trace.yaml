# Ablation of haiku_ts_order: the feedback also shows one likely way the rules fail (a trace from the start along the most
# likely failing outcomes; feedback.trajectory).
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [patrol, early]
  any_order: all
run:
  workers: 4
  train_sets: [[0, 4, 8], [1, 5, 9], [2, 6, 10], [3, 7, 11]]
prompt:
  generality: true
planner:
  retry: never
feedback:
  trajectory: true
