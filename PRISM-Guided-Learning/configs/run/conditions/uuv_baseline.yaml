# Baselines on the UUV family (Rajan's checklist, item 8), not an LLM condition: the rule language the baseline policies
# are written in and certified with. The extended vocabulary (domains/uuv/domain.py rule_vocabulary) with numbers
# allowed (`general: false`), so a tree over the raw variables compiles into rules such as `water_visib <= 4`.
#   python src/run_baseline.py configs/baselines/uuv_tree_raw.yaml
domain:
  name: uuv
  dataset: uuv_family_v0.csv
rules:
  extended: true
  general: false
