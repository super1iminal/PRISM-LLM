# Asher's UUV plan, step 6: the Restart arm of port_uuv, with only `planner.retry: always` changed (every round starts
# from the initial prompt, no feedback), as port_mer_resample is of port_mer.
domain: {name: uuv, dataset: uuv_family_v0.csv}
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules: {extended: true, general: true, any_order: none, strict: true}
prompt: {generality: true, worst_case: true}
feedback: {horizon: domain}
planner: {retry: always, feedback: failures, max_rounds: 7, chains: 8, done_margin: 0.0001, branch: per_requirement,
  pick: candidates, pick_top: 6, repair: 25, repair_tries: 40}
run:
  workers: 4
  train_sets:
  - [0, 6, 10]
