# Head-to-head on LLM-written vocabulary, new pipeline: no hand-written features. Haiku 5.5 first defines its
# own features in the definition language (core/definitions.py) from the model's labels, variables and
# constants, then may add more with its rule answers (add-only, at most 3 per answer and 10 in total). Level 1:
# no definition can compute more than the baseline's strongest feature, closer. Everything else as
# haiku_vocab_baseline: model, training sets (grids 0-11), rounds, rule language, fixed test set (grids 12-19).
#   python src/run_ablation.py haiku_vocab_baseline haiku_vocab_llm --unseeded 3
#   python src/transfer.py out/results/ablations/haiku_vocab_llm/seed_none_<k> --targets 12-19   (test set)
#   python src/transfer.py out/results/ablations/haiku_vocab_llm/seed_none_<k>                   (heatmap)
# Tokens: SYMBOLIC_results.parquet has vocab_llm_* (the vocabulary step) and llm_* (all calls, both steps).
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: []
  vocabulary: llm
  definition_level: 1
  max_definitions: 10
  max_new_definitions: 3
run:
  workers: 4
  train_sets: [[0, 4, 8], [1, 5, 9], [2, 6, 10], [3, 7, 11]]
