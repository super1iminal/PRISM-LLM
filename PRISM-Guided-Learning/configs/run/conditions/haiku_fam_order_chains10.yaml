# haiku_fam_order with planner.chains: 10: ten independent loops per training set, the final list the chain
# whose rules have the largest worst-case margin on the training members (exact check). any_prune: same
# choices, fewer PRISM checks.
#   python src/run_search.py haiku_fam_order_chains10 --unseeded 3 --targets 16-35,76-95,136-155
domain:
  dataset: families_v0.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [hazard]
  any_order: all
  any_prune: true
prompt:
  generality: true
planner:
  retry: never
  chains: 10
run:
  workers: 8
  train_sets: [[0, 4, 8], [60, 64, 68], [120, 124, 128]]
