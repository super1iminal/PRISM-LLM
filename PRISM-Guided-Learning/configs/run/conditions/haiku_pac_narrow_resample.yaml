# Pac-Man, verifier narrowing with pure resampling: as haiku_pac_narrow (place literals, early check, narrowing up to 3
# moves away from their places, stop at the first passing list), but every round is a fresh initial prompt
# (planner.retry: always, as the 18-round restarts ablation of haiku_mi_pacman_long, which solved training most often)
# and `any` resolved into the best of the 4 rotations of the action order, as the core. 30 rounds (about 1 round in 8
# of that ablation passed training, so 30 rounds solve almost every set).
#   python src/run_search.py haiku_pac_narrow_resample --unseeded 3 --targets 0-7,9 --max-parallel 2 --transfer-workers 1
domain:
  name: pacman
  dataset: pacman_transfer.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
feedback:
  horizon: domain
  early: steps
  early_group: [xP, yP]
  early_tolerance: 1.0
rules:
  extended: true
  general: true
  shared_literals: true
  hidden_features: [closer_g0, closer_g1]
  any_order: rotations
  early_narrow: 3
prompt:
  generality: true
planner:
  retry: always
  max_rounds: 30
run:
  workers: 1
  train_sets: [[3, 4, 5]]
