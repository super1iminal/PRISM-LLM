# Pac-Man, maze-distance features shown: haiku_mi_pacman_long (training horizons 14, 16, 18; `any` resolved into the
# best rotation of the action order), but closer_g0 and closer_g1 (this direction's first step shortens the maze
# distance to the ghost) are in the vocabulary.
#   python src/run_search.py haiku_pac_closer --unseeded 3 --targets 0-7,9 --max-parallel 2 --transfer-workers 1
domain:
  name: pacman
  dataset: pacman_transfer.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
feedback:
  horizon: domain
rules:
  extended: true
  general: true
  hidden_features: []
  any_order: rotations
prompt:
  generality: true
planner:
  retry: never
run:
  workers: 1
  train_sets: [[3, 4, 5]]
