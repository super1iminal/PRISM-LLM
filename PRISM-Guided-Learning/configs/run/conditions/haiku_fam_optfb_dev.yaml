# haiku_fam_order with feedback.optimal and feedback.deviations: the optimal strategy at the states the feedback names, and
# the states the rules reach where their action loses most against it (DAgger-style labels of the rules' own states).
domain:
  dataset: families_v0.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [hazard]
  any_order: all
prompt:
  generality: true
planner:
  retry: never
run:
  workers: 3
  train_sets: [[0, 4, 8], [60, 64, 68], [120, 124, 128]]
feedback:
  optimal: true
  deviations: true
