# A cheaper Claude (vs. sonnet5_5): Claude Haiku 5.5 on OpenRouter, Anthropic's endpoint pinned; otherwise sonnet5_5's
# settings (thinking on, 16k output cap covering thinking and answer; R4's retry), so only the model differs.
# Unseeded: no Anthropic endpoint accepts a seed. Repeats:
#   python src/run_ablation.py haiku5_5 --unseeded 1
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
planner:
  retry: "gain:0.05"
