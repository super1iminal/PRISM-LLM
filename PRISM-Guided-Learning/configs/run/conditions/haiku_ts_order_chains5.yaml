# haiku_ts_order with planner.chains: 5: five independent loops per training set, the final list the chain whose
# rules have the largest worst-case margin on the training members (exact check). any_prune: same choices, fewer
# PRISM checks.
#   python src/run_search.py haiku_ts_order_chains5 --unseeded 3 --targets 12-19
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [patrol, early]
  any_order: all
  any_prune: true
run:
  workers: 6
  train_sets: [[0, 4, 8], [1, 5, 9], [2, 6, 10], [3, 7, 11]]
prompt:
  generality: true
planner:
  retry: never
  chains: 5
