# Ablation of haiku_ts_order: `any` rules are kept as written (worst case), and the feedback reports the order of the 24 that
# would do best; the LLM decides whether to write it into its rules (rules.any_order: report).
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [patrol, early]
  any_order: report
run:
  workers: 4
  train_sets: [[0, 4, 8], [1, 5, 9], [2, 6, 10], [3, 7, 11]]
prompt:
  generality: true
planner:
  retry: never
