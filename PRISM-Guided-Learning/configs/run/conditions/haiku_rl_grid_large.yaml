# Rule-language branch: Haiku 5.5 on grid_20_large with the extended, general rule vocabulary (instance constants,
# features wall/hazard/toward, `any` rules, no numbers but 0 and 1); the shortest-path feature `closer` is hidden.
# Otherwise haiku_large_R4's settings (restart on slow progress), so only the vocabulary differs.
#   python src/run_ablation.py haiku_rl_grid_large --unseeded 1
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [closer]
