# port_pacman (the ported fresh method: strict vocabulary, worst case spelled out, `any` open, failure feedback on
# every member, 8 chains of up to 7 answers stopping at a margin of 0.002, pick with repair) plus verifier narrowing:
# numbers may be compared with the variables whose range is the same on every member (rules.shared_literals:
# positions and headings), and once the pick has chosen, its list with `any` resolved by the pick's best order is
# narrowed (rules.early_narrow: a move that loses in at least 3/4 of the first-half training situations at a place is
# kept away from it, if every member still passes and the early loss drops; feedback.early on, grouped by Pac-Man's
# position). The early loss ranks nothing (feedback.early_rank false) and the chains stop as port_pacman's
# (early_tolerance 1). Feedback-only twin: port_pacman_early.
#   python src/run_search.py port_pacman_narrow --unseeded 3 --targets 0-7,9 --max-parallel 1 --transfer-workers 1
domain: {name: pacman, dataset: pacman_transfer.csv}
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
feedback: {horizon: domain, early: steps, early_group: [xP, yP], early_tolerance: 1.0, early_rank: false}
rules:
  extended: true
  general: true
  shared_literals: true
  hidden_features: [closer_g0, closer_g1]
  any_order: none
  strict: true
  early_narrow: 3
prompt: {generality: true, worst_case: true}
planner: {retry: never, feedback: failures, max_rounds: 7, chains: 8, done_margin: 0.002,
  pick: candidates, pick_top: 6, repair: 25, repair_tries: 40}
run:
  workers: 4
  train_sets:
  - [3, 4, 5]
