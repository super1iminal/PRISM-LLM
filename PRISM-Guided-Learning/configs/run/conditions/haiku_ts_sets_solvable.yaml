# Transfer search (docs/transfer_plan.md), batch 1: haiku_mi_grid_large_closer with training sets that one generic
# rule list can solve (each a 9x9, a 10x10 and an 11x11 grid that the searched list from [2,6,10] passes; the
# standard sets each contain a grid no generic list passed: DECISIONS.md, "Transfer search").
#   python src/run_search.py haiku_ts_sets_solvable
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: []
run:
  workers: 4
  train_sets: [[2, 4, 8], [3, 5, 9], [2, 6, 10], [3, 4, 10]]
