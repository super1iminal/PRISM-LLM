# Item 3 (Rajan's checklist, SEAMS): OpenAI GPT-6 Luna on OpenRouter, provider pinned to openai ($0.10 / $0.50 per M
# prompt / output tokens, the standard endpoint as listed on 2026-10-19). Reasoning on (`llm.think: true`, OpenRouter's
# reasoning.enabled at the provider's default effort), the closest equivalent of the Haiku runs' extended thinking.
# OpenAI's strict JSON schema needs `additionalProperties: false` (llm.openrouter.schema_adapter; checklist rule 1).
# port_mer with only the model, its provider and the schema adapter changed (diff against port_mer.yaml).
# The fresh-transfer session's method ported into the loop (src/core/failures.py, src/core/pick.py): strict
# vocabulary (rules.strict), the worst case spelled out (prompt.worst_case), `any` open in the loop, feedback on every
# member with the failure locations and the attempt history (planner.feedback: failures), 8 independent chains
# of up to 7 answers stopping at a margin of 0.002, then the best 6 distinct lists of every round, each repaired on the members (25 hill-climbing steps of 40 tries),
# and the one certified on most members with the largest margin. Based on haiku_mi_mer.
#   python src/run_search.py port_mer --unseeded 3 --targets 0-8 --determinize --max-parallel 1 --transfer-workers 1
domain: {name: mer, dataset: mer_transfer.csv}
llm:
  model: openai/gpt-6-luna
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [openai]
    schema_adapter: [no_additional_properties]
rules: {extended: true, general: true, any_order: none, strict: true}
prompt: {generality: true, worst_case: true}
planner: {retry: never, feedback: failures, max_rounds: 7, chains: 8, done_margin: 0.002,
  pick: candidates, pick_top: 6, repair: 25, repair_tries: 40}
run:
  workers: 4
  train_sets:
  - [0, 1, 2]
