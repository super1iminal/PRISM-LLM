# Transfer search on gridworld families (docs/transfer_plan.md, Phase 1b): Haiku 5.5, one rule set per family
# (rooms, crossing, adjacent of families_v0.csv), each trained on its 6x6, 7x7 and 8x8 members (seed 0); then
# certified on the family's 10x10-14x14 members (validation). Vocabulary v2 with closer, the generality instruction,
# no restarts (as haiku_ts_norestart).
#   python src/run_search.py haiku_fam_v0 --targets 16-35,76-95,136-155
domain:
  dataset: families_v0.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [patrol, early]   # patrol, early: added later, hidden to keep this condition's prompts
prompt:
  generality: true
planner:
  retry: never
run:
  workers: 3
  train_sets: [[0, 4, 8], [60, 64, 68], [120, 124, 128]]
