# Ablation of haiku_fam_order: counterexample-driven training sets. Once a family's set is solved, its rules are
# checked on the family's other members of sizes 6-8 (seeds 1-3), and the first that fails joins the set
# (run.pool_sets); 10 rounds (control: haiku_fam_order_r10).
domain:
  dataset: families_v0.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [hazard]
  any_order: all
prompt:
  generality: true
planner:
  max_rounds: 10
  retry: never
run:
  workers: 3
  train_sets: [[0, 4, 8], [60, 64, 68], [120, 124, 128]]
  pool_sets: [[1, 2, 3, 5, 6, 7, 9, 10, 11], [61, 62, 63, 65, 66, 67, 69, 70, 71], [121, 122, 123, 125, 126, 127, 129, 130, 131]]
