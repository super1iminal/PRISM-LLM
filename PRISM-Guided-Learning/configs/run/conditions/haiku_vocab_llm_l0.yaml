# Head-to-head on LLM-written vocabulary at level 0: as haiku_vocab_llm, but definitions may only look one step
# ahead (next, slip, stays; no closer_to), so no feature can find a way around walls. Its pair is
# haiku_vocab_baseline_l0 (hand-written features without closer), the level-0 analogue of the main comparison:
# it asks whether the LLM's own one-step vocabulary transfers without the shortest-path help.
#   python src/run_ablation.py haiku_vocab_baseline_l0 haiku_vocab_llm_l0 --unseeded 3
#   python src/transfer.py out/results/ablations/haiku_vocab_llm_l0/seed_none_<k> --targets 12-19   (test set)
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: []
  vocabulary: llm
  definition_level: 0
  max_definitions: 10
  max_new_definitions: 3
run:
  workers: 4
  train_sets: [[0, 4, 8], [1, 5, 9], [2, 6, 10], [3, 7, 11]]
