# Item 8 (Rajan's checklist): the core configuration on the UUV family (domains/uuv/data/uuv_family_v0.csv). port_mer
# (the core loop for domains other than gridworld) with only the domain's settings changed:
# - domain uuv, dataset uuv_family_v0.csv, trained on its three training members (ids 0, 6, 10);
# - planner.branch: per_requirement (PRISM's joint query cannot decide UUV's requirements; DECISIONS, "Joint queries");
# - feedback.horizon: domain (the mission deadline, as U1);
# - planner.done_margin 0.0001: the family's thresholds sit at 10% of each requirement's range, and the best margins
#   reachable are about 0.0002-0.001 (the gate's hand-written list), so MER's 0.002 would never count a set solved.
domain: {name: uuv, dataset: uuv_family_v0.csv}
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules: {extended: true, general: true, any_order: none, strict: true}
prompt: {generality: true, worst_case: true}
feedback: {horizon: domain}
planner: {retry: never, feedback: failures, max_rounds: 7, chains: 8, done_margin: 0.0001, branch: per_requirement,
  pick: candidates, pick_top: 6, repair: 25, repair_tries: 40}
run:
  workers: 4
  train_sets:
  - [0, 6, 10]
