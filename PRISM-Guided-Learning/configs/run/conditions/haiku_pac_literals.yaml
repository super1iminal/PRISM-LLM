# Pac-Man, place literals only (control for haiku_pac_early): haiku_mi_pacman_long, but numbers may be compared with the
# variables whose range is the same on every training member (rules.shared_literals: positions and headings, not
# steps), so rules can name places in the maze. 8 rounds, as haiku_pac_early.
#   python src/run_search.py haiku_pac_literals --unseeded 3 --targets 0-7,9 --max-parallel 2 --transfer-workers 1
domain:
  name: pacman
  dataset: pacman_transfer.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
feedback:
  horizon: domain
rules:
  extended: true
  general: true
  shared_literals: true
  hidden_features: [closer_g0, closer_g1]
  any_order: rotations
prompt:
  generality: true
planner:
  retry: never
  max_rounds: 8
run:
  workers: 1
  train_sets: [[3, 4, 5]]
