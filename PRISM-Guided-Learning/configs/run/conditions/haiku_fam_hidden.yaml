# Ablation of haiku_fam_order: each family's seed-1 members of sizes 6-8 as hidden members, verified and scored every
# round but never shown to the LLM, which only sees how many of them pass (run.hidden_sets).
domain:
  dataset: families_v0.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [hazard]
  any_order: all
prompt:
  generality: true
planner:
  retry: never
run:
  workers: 3
  train_sets: [[0, 4, 8], [60, 64, 68], [120, 124, 128]]
  hidden_sets: [[1, 5, 9], [61, 65, 69], [121, 125, 129]]
