# Vocabulary version 1: the run predates the features obstacle and risky, so its config.json lists fewer hidden
# features; hiding them here reproduces it with today's code.
# Rule-language branch: Sonnet 5.5 on grid_20_large with the extended, general rule vocabulary (instance constants,
# features wall/hazard/toward, `any` rules, no numbers but 0 and 1); the shortest-path feature `closer` is hidden.
# Otherwise the default settings (restart on slow progress); compare with haiku_rl_grid_large (same vocabulary, Haiku).
#   python src/run_ablation.py sonnet5_5_rl_grid_large --unseeded 1
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-sonnet-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [closer, obstacle, risky]
