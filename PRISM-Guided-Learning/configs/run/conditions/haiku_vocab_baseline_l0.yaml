# Head-to-head on LLM-written vocabulary at level 0, baseline: hand-written gridworld features (v2) without the
# shortest-path feature closer, so every feature looks one step ahead. Pair of haiku_vocab_llm_l0; otherwise as
# haiku_vocab_baseline (same as haiku_mi_grid_large except the explicit vocabulary setting).
#   python src/run_ablation.py haiku_vocab_baseline_l0 haiku_vocab_llm_l0 --unseeded 3
#   python src/transfer.py out/results/ablations/haiku_vocab_baseline_l0/seed_none_<k> --targets 12-19   (test set)
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [closer]
  vocabulary: domain
run:
  workers: 4
  train_sets: [[0, 4, 8], [1, 5, 9], [2, 6, 10], [3, 7, 11]]
