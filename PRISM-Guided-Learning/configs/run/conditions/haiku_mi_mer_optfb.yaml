# haiku_mi_mer with feedback.optimal: at the states the feedback names, what the optimal strategy of that training member does there
# (the information 1-2-3-Go! learns from).
domain:
  name: mer
  dataset: mer_transfer.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  any_order: rotations
prompt:
  generality: true
planner:
  retry: never
run:
  workers: 1
  train_sets: [[0, 1, 2]]
feedback:
  optimal: true
