# Sonnet 5.5 with haiku_mi_mer's settings (only the model differs); runs need Asher's go-ahead.
# Mars Exploration Rovers, the core configuration (as haiku_mi_pacman_long): Haiku 5.5 with the general vocabulary
# (constants N and X_PCT, features shortcuts_left and enabled, `any` rules), one training set of x = 0.01, 0.05 and
# 0.13 at n = 10 (mer_transfer.csv ids 0-2), `any` rules resolved each round into the best rotation of the action
# order, the generality instruction and no restarts; then certified on the validation instances (ids 3-8: x = 0.03,
# 0.08, 0.21, 0.34 at n = 10; n = 1 and 20 at x = 0.01). 1-2-3-Go! publishes 0.19999 everywhere, which passes the
# thresholds only for x <= 0.05.
#   python src/run_search.py sonnet5_5_mi_mer --unseeded 3 --targets 0-8
domain:
  name: mer
  dataset: mer_transfer.csv
llm:
  model: anthropic/claude-sonnet-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  any_order: rotations
prompt:
  generality: true
planner:
  retry: never
run:
  workers: 1
  train_sets: [[0, 1, 2]]
