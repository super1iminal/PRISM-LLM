# Haiku ablation on grid_20_large (DECISIONS.md, planned Oct 8): restart after 2 stalls (B2's retry; the default is R4's), with Claude Haiku 5.5
# (haiku5_5's settings: thinking on, 16k output cap, Anthropic's endpoint). Unseeded, two runs per condition:
#   python src/run_ablation.py haiku_large_B2 haiku_large_R4 haiku_large_R5 --unseeded 2
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
planner:
  retry: "stall:2"
