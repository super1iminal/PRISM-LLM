# Head-to-head on LLM-written vocabulary, baseline: hand-written gridworld features (v2) + closer, the best so far.
# Haiku 5.5 writes one rule set per training set of three grids from grid_20_large (a 9x9, a 10x10 and an 11x11,
# all from grids 0-11); grids 12-19 (12x12 and 13x13) are the fixed test set. Same as haiku_mi_grid_large_closer
# except the explicit vocabulary setting; its pair is haiku_vocab_llm, which differs only in rules.vocabulary.
#   python src/run_ablation.py haiku_vocab_baseline haiku_vocab_llm --unseeded 3
#   python src/transfer.py out/results/ablations/haiku_vocab_baseline/seed_none_<k> --targets 12-19   (test set)
#   python src/transfer.py out/results/ablations/haiku_vocab_baseline/seed_none_<k>                   (heatmap)
#   python viz/plot_transfer.py configs/plot/transfer_vocab.yaml
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: []
  vocabulary: domain
run:
  workers: 4
  train_sets: [[0, 4, 8], [1, 5, 9], [2, 6, 10], [3, 7, 11]]
