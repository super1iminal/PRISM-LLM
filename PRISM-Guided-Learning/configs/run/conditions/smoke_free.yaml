# Cluster smoke test only (cluster/smoke/), never an experiment cell: port_fam_history's loop, cut down to a handful
# of calls to a free OpenRouter model, so a key with no credits (50 free requests a day) can run it end to end.
# One training set (rooms 6x6-8x8), one chain, 2 rounds, one fix-up: at most 4 LLM requests. The free Nemotron
# endpoint has no structured outputs, so the schema goes in the prompt (llm.openrouter.structured: false).
# Everything else is port_fam_history's.
#   python src/run_ablation.py smoke_free --unseeded 1 --name smoke_free_<job> --out-root out/results/smoke/fir
domain: {dataset: families_v0.csv}
llm:
  model: nvidia/nemotron-3-ultra-550b-a55b:free
  backend: openrouter
  think: false
  num_predict: 16384
  openrouter:
    providers: []
    structured: false
    max_retries: 4
rules:
  extended: true
  general: true
  hidden_features: [hazard]
  any_order: none
  strict: true
prompt:
  generality: true
  worst_case: true
  examples: false
  compact: true
  hint: "Think about a strategy that works on every instance: how to make progress towards the next goal, how to cross or avoid the patrol without collisions, how slips can hurt, and what to do when the preferred move is unsafe."
feedback: {history: true, words: true}
planner: {retry: never, feedback: failures, max_rounds: 2, max_fixups: 1, chains: 1, done_margin: 0.05,
  pick: candidates, pick_top: 8, repair: 40, repair_tries: 60}
run:
  workers: 1
  train_sets:
  - [0, 4, 8]
