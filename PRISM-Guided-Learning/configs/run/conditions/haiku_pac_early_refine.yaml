# Pac-Man, early-game check shown from the first round on: haiku_pac_early, and the early section also appears in
# the refine and extend prompts before the members pass (feedback.early_refine), with the losses grouped by rule and
# place (feedback.early_group: Pac-Man's position). Otherwise as haiku_pac_early:
# haiku_mi_pacman_long (training horizons 14, 16, 18; `any` resolved into the best rotation
# of the action order), plus (1) rules.shared_literals: numbers may be compared with the variables whose range is the
# same on every training member (positions and headings, not steps), so rules can name places in the maze; and
# (2) feedback.early: once the rules pass the training members, their move in every state of the first half of each
# training game (any play) is scored against the best move there (core/early.py), and the loop keeps refining while
# the mean loss exceeds feedback.early_tolerance (keep-best prefers the lower loss). 8 rounds.
#   python src/run_search.py haiku_pac_early_refine --unseeded 3 --targets 0-7,9 --max-parallel 2 --transfer-workers 1
domain:
  name: pacman
  dataset: pacman_transfer.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
feedback:
  horizon: domain
  early: steps
  early_refine: true
  early_group: [xP, yP]
rules:
  extended: true
  general: true
  shared_literals: true
  hidden_features: [closer_g0, closer_g1]
  any_order: rotations
prompt:
  generality: true
planner:
  retry: never
  max_rounds: 8
run:
  workers: 1
  train_sets: [[3, 4, 5]]
