# Transfer search (docs/transfer_plan.md), batch 2: haiku_ts_norestart plus a hint (prompt.hint) naming the two moves the searched rule list uses: fixed\n# action orders instead of any, and waiting by moving into a wall. Deliberate hard-coding, to be trimmed later.
#   python src/run_search.py haiku_ts_hint_wait
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [patrol, early]   # patrol, early: added later, hidden to keep this condition's prompts
run:
  workers: 4
  train_sets: [[0, 4, 8], [1, 5, 9], [2, 6, 10], [3, 7, 11]]
prompt:
  generality: true
  tie_break: true
  hint: "When no move is both safe and closer to the next goal, it can be better to wait: a move into a wall or off the grid leaves the agent where it is."
planner:
  retry: never
