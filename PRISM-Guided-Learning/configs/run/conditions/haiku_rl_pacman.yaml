# Rule-language branch: Haiku 5.5 on Pac-Man with the extended, general rule vocabulary (constant MAXSTEPS, features
# moves_left/wall/nearer_g0/nearer_g1, `any` rules, no numbers but 0 and 1). Otherwise haiku_pacman's settings.
#   python src/run_ablation.py haiku_rl_pacman --unseeded 1
domain:
  name: pacman
  dataset: pacman.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
feedback:
  horizon: domain
rules:
  extended: true
  general: true
  hidden_features: []
