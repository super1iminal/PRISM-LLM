# Gridworld families with the split vocabulary: haiku_fam_v0, but `hazard` replaced by `patrol` (the move enters
# the moving obstacle's path: safe when the obstacle will not be there) and `early` (the move enters a goal not yet
# due). In haiku_fam_v0 Haiku wrote `!hazard` everywhere and never crossed the patrol, which crossing and rooms need.
#   python src/run_search.py haiku_fam_split --targets 16-35,76-95,136-155 --determinize
domain:
  dataset: families_v0.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [hazard]
prompt:
  generality: true
planner:
  retry: never
run:
  workers: 3
  train_sets: [[0, 4, 8], [60, 64, 68], [120, 124, 128]]
