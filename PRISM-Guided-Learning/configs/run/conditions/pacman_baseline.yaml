# Baselines on Pac-Man (plan 02), not an LLM condition: the rule language baseline policies are written in and
# certified with. The extended vocabulary (features, the constant MAXSTEPS) with numbers allowed (`general: false`),
# so a decision tree over the raw variables compiles into rules such as `xP <= 3 & steps >= 2`; no feature hidden.
#   python src/run_baseline.py configs/baselines/pacman_tree_raw.yaml
domain:
  name: pacman
  dataset: pacman_transfer.csv
rules:
  extended: true
  general: false
