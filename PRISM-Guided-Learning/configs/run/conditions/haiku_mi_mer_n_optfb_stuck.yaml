# haiku_mi_mer_n with feedback.optimal and feedback.stuck: at the states the feedback names, what the optimal strategy does there, and
# which of the rules' actions change nothing there (MER's disabled actions are self-loops, a run that takes one stays forever).
domain:
  name: mer
  dataset: mer_n_transfer.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  any_order: rotations
prompt:
  generality: true
planner:
  retry: never
run:
  workers: 1
  train_sets: [[0, 1, 2]]
feedback:
  optimal: true
  stuck: true
