# Pac-Man's general rule language with the maze-distance features closer_g0/closer_g1 shown (the LLM conditions hide
# them). No LLM runs: it is the rule language configs/baselines/pacman_maze_rules.yaml certifies its hand-written lists in.
domain:
  name: pacman
  dataset: pacman_transfer.csv
feedback:
  horizon: domain
rules:
  extended: true
  general: true
  hidden_features: []
