# haiku_mi_mer_n with feedback.optimal, feedback.stuck and planner.ties: newest (on an equal score the newer list is kept, so the
# next feedback is about it: on MER's flat 0.2 plateau every candidate ties).
domain:
  name: mer
  dataset: mer_n_transfer.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  any_order: rotations
prompt:
  generality: true
planner:
  retry: never
  ties: newest
run:
  workers: 1
  train_sets: [[0, 1, 2]]
feedback:
  optimal: true
  stuck: true
