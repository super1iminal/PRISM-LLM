# Multi-instance training (core/training.py): Haiku 5.5 writes one rule set per training set of three grids from
# grid_20_large (a 9x9, a 10x10 and an 11x11), verified on all three each round; the frozen rules are then certified
# on all 20 grids with src/transfer.py (12x12 and 13x13 are never trained on). Vocabulary version 2 (all gridworld
# features but the shortest-path feature `closer`); otherwise as haiku_rl2_grid_large.
#   python src/run_ablation.py haiku_mi_grid_large --unseeded 1
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [closer]
run:
  workers: 4
  train_sets: [[0, 4, 8], [1, 5, 9], [2, 6, 10], [3, 7, 11]]
