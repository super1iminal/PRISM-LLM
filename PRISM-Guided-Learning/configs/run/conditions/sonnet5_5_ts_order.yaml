# Sonnet 5.5 with haiku_ts_order's settings (only the model differs), one repeat (Asher, Oct 14).
# Transfer search: haiku_ts_norestart with `any` rules resolved each round into the action order that does best on
# the training members (rules.any_order: all, 24 orders verified per round).
#   python src/run_search.py sonnet5_5_ts_order
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-sonnet-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [patrol, early]
  any_order: all
run:
  workers: 4
  train_sets: [[0, 4, 8], [1, 5, 9], [2, 6, 10], [3, 7, 11]]
prompt:
  generality: true
planner:
  retry: never
