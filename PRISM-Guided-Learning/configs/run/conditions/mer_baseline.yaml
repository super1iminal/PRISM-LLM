# Baselines on Mars Exploration Rovers (plan 08), not an LLM condition: the rule language baseline policies are
# written in and certified with. The extended vocabulary (constants N and X_PCT, features shortcuts_left and enabled)
# with numbers allowed (`general: false`), so a decision tree over the raw variables compiles into rules such as
# `s1 <= 2 & k >= 3`.
#   python src/run_baseline.py configs/baselines/mer_tree_raw.yaml
domain:
  name: mer
  dataset: mer_transfer.csv
rules:
  extended: true
  general: false
