# port_mer_n trained on one instance, as 1-2-3-Go!'s paper trains on one base instance: n = 1 at x = 0.89
# (mer_n_transfer.csv id 0), certified on ids 1-8 (9-11 are sealed); the RQ1 benchmark mer_n_one. Everything else as
# port_mer_n.
#   python src/run_search.py port_mer_n_one --unseeded 3 --targets 0-8 --determinize --max-parallel 1 --transfer-workers 1
domain: {name: mer, dataset: mer_n_transfer.csv}
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules: {extended: true, general: true, any_order: none, strict: true}
prompt: {generality: true, worst_case: true}
planner: {retry: never, feedback: failures, max_rounds: 7, chains: 8, done_margin: 0.002,
  pick: candidates, pick_top: 6, repair: 25, repair_tries: 40}
run:
  workers: 4
  train_sets:
  - [0]
