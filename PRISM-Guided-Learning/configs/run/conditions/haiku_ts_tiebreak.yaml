# Transfer search (docs/transfer_plan.md), batch 1: haiku_mi_grid_large_closer plus the tie-break explanation
# (prompt.tie_break: `any` is resolved against the policy; write one rule per action to fix an order).
#   python src/run_search.py haiku_ts_tiebreak
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [patrol, early]   # patrol, early: added later, hidden to keep this condition's prompts
prompt:
  tie_break: true
run:
  workers: 4
  train_sets: [[0, 4, 8], [1, 5, 9], [2, 6, 10], [3, 7, 11]]
