# Asher's UUV plan, step 4: port_uuv with only `run.train_sets` changed, to three training sets, so each run yields a
# library of three lists. Set 0 is item 8's ([0, 6, 10]); sets 1 and 2 are training-only members at inspection lengths
# the validation grid does not contain (domains/uuv/data/family_v0.py --append sets): W 8, 10, 12 at 9 m (ids 42-44)
# and W 7, 9, 11 at 11 m (ids 45-47). The rule was fixed before any run, not chosen from failing validation members.
domain: {name: uuv, dataset: uuv_family_v0.csv}
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules: {extended: true, general: true, any_order: none, strict: true}
prompt: {generality: true, worst_case: true}
feedback: {horizon: domain}
planner: {retry: never, feedback: failures, max_rounds: 7, chains: 8, done_margin: 0.0001, branch: per_requirement,
  pick: candidates, pick_top: 6, repair: 25, repair_tries: 40}
run:
  workers: 4
  train_sets:
  - [0, 6, 10]
  - [42, 43, 44]
  - [45, 46, 47]
