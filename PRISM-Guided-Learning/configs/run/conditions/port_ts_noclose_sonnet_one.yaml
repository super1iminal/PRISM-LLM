# port_ts_noclose with Sonnet 5.5 and one chain instead of eight (Asher's go-ahead, Oct 16): a cheap screen of whether
# Sonnet helps the new loop on grids without `closer`, the one benchmark it loses (Haiku: 3.5-3.7 of 8; the
# hand-written template: 6.00). If it beats 6.00, the full loop (eight chains) follows. Only the model and the number of
# chains differ from port_ts_noclose.
#   python src/run_search.py port_ts_noclose_sonnet_one --unseeded 1 --targets 12-19 --max-parallel 1 --transfer-workers 1
#   python src/transfer.py <run> --rules determinized --targets 12-19 --workers 1
domain: {dataset: grid_20_large.csv}
llm:
  model: anthropic/claude-sonnet-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [hazard, closer]
  any_order: none
  strict: true
run:
  workers: 4
  train_sets:
  - [0, 4, 8]
  - [1, 5, 9]
  - [2, 6, 10]
  - [3, 7, 11]
prompt: {generality: true, worst_case: true, examples: false}
planner: {retry: never, feedback: failures, max_rounds: 7, chains: 1, done_margin: 0.05,
  pick: candidates, pick_top: 8, repair: 40, repair_tries: 60}
