# U1 with Claude Sonnet 5.5 (the model settings of sonnet5_5): UUV pipeline inspection on the paper's two scenarios,
# energy requirement included, B2's retry, mass horizon = the mission deadline. Thinking on (Sonnet 5.5's endpoints
# refuse to turn it off), 16k output cap for thinking and answer. Unseeded (no Sonnet endpoint accepts a seed):
#   python src/run_symbolic.py --condition U1_sonnet5_5 --out out/results/ablations/U1_sonnet5_5/seed_none
domain:
  name: uuv
  dataset: uuv_paper.csv
planner:
  retry: "stall:2"
feedback:
  horizon: domain     # the mission deadline (North Sea 30, Caribbean 70)
llm:
  model: anthropic/claude-sonnet-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
