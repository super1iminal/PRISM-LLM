# Transfer search: haiku_ts_generality without restarts (planner.retry: never), so every round after the first refines or extends.
#   python src/run_search.py haiku_ts_norestart
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [patrol, early]   # patrol, early: hidden, so the prompts match this condition's runs
run:
  workers: 4
  train_sets: [[0, 4, 8], [1, 5, 9], [2, 6, 10], [3, 7, 11]]
prompt:
  generality: true
planner:
  retry: never
