# Second LLM (E3): Claude Sonnet 5.5 on OpenRouter, provider pinned to anthropic.
# SEAMS evaluation (2026-10-19): port_ts_history with one change: llm.model anthropic/claude-haiku-5.5 -> anthropic/claude-sonnet-5.5.
# port_ts with its gridworld prompt and feedback brought closer to the fresh-transfer code (Oct 16; the prompt diff is in
# the opt-feedback notes): failure locations and risks that count a sequence requirement met once the goal flags show
# it (feedback.history; without it, entering the next goal in its turn read as the failure), states and risks in the
# domain's words (feedback.words), the gridworld rules once and a short text per grid (prompt.compact), and the
# fresh prompt's strategy hint (prompt.hint).
#   python src/run_search.py port_ts_history --unseeded 3 --targets 12-19 --max-parallel 1 --transfer-workers 1
domain: {dataset: grid_20_large.csv}
llm:
  model: anthropic/claude-sonnet-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [hazard]
  any_order: none
  strict: true
run:
  workers: 4
  train_sets:
  - [0, 4, 8]
  - [1, 5, 9]
  - [2, 6, 10]
  - [3, 7, 11]
prompt:
  generality: true
  worst_case: true
  examples: false
  compact: true
  hint: "Think about a strategy that works on every instance: how to make progress towards the next goal, how to cross or avoid the patrol without collisions, how slips can hurt, and what to do when the preferred move is unsafe."
feedback: {history: true, words: true}
planner: {retry: never, feedback: failures, max_rounds: 7, chains: 8, done_margin: 0.05,
  pick: candidates, pick_top: 8, repair: 40, repair_tries: 60}
