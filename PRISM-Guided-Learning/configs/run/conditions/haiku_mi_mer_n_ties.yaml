# haiku_mi_mer_n with planner.ties: newest only (the control for haiku_mi_mer_n_optfb_ties).
domain:
  name: mer
  dataset: mer_n_transfer.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  any_order: rotations
prompt:
  generality: true
planner:
  retry: never
  ties: newest
run:
  workers: 1
  train_sets: [[0, 1, 2]]
