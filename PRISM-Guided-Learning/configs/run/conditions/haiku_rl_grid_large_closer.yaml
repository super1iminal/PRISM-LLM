# Vocabulary version 1: the run predates the features obstacle and risky, so its config.json lists fewer hidden
# features; hiding them here reproduces it with today's code.
# Rule-language branch: as haiku_rl_grid_large, with the shortest-path feature `closer` available too.
#   python src/run_ablation.py haiku_rl_grid_large_closer --unseeded 1
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [obstacle, risky]
