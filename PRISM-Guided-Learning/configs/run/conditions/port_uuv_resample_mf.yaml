# port_uuv_resample with only `planner.repair_score: members_first` added: repair keeps the members passing first,
# then improves the capped margin sum (DECISIONS, "Repair can lose a member"). The members_first variant of
# the UUV plan's runs, beside the capped_sum ones (cluster/queue_uuv2.sh).
domain: {name: uuv, dataset: uuv_family_v0.csv}
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules: {extended: true, general: true, any_order: none, strict: true}
prompt: {generality: true, worst_case: true}
feedback: {horizon: domain}
planner: {retry: always, feedback: failures, max_rounds: 7, chains: 8, done_margin: 0.0001, branch: per_requirement,
  pick: candidates, pick_top: 6, repair: 25, repair_tries: 40, repair_score: members_first}
run:
  workers: 4
  train_sets:
  - [0, 6, 10]
