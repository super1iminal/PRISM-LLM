# The fresh-transfer session's method ported into the loop (src/core/failures.py, src/core/pick.py): strict
# vocabulary (rules.strict), the worst case spelled out (prompt.worst_case), `any` open in the loop, feedback on every
# member with the failure locations and the attempt history (planner.feedback: failures), 6 independent chains
# of up to 7 answers stopping at a margin of 0.05, then the best 8 distinct lists of every round, not repaired (planner.repair: 0),
# and the one certified on most members with the largest margin. Based on haiku_fam_order.
#   python src/run_search.py port_fam_norepair --unseeded 3 --targets 16-35,76-95,136-155 --determinize --max-parallel 1 --transfer-workers 1
domain: {dataset: families_v0.csv}
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [hazard]
  any_order: none
  strict: true
prompt: {generality: true, worst_case: true}
planner: {retry: never, feedback: failures, max_rounds: 7, chains: 6, done_margin: 0.05,
  pick: candidates, pick_top: 8, repair: 0, repair_tries: 60}
run:
  workers: 4
  train_sets:
  - [0, 4, 8]
  - [60, 64, 68]
  - [120, 124, 128]
