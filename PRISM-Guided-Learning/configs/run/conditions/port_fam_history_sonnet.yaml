# Second LLM (E3): Claude Sonnet 5.5 on OpenRouter, provider pinned to anthropic.
# SEAMS evaluation (2026-10-19): port_fam_history with one change: llm.model anthropic/claude-haiku-5.5 -> anthropic/claude-sonnet-5.5.
# port_fam with port_ts_history's four additions (the same flags and hint as port_ts_history adds to port_ts):
# failure locations and risks that count a sequence requirement met once the goal flags show it (feedback.history),
# states and risks in the domain's words (feedback.words), the gridworld rules once and a short text per grid
# (prompt.compact), and the fresh prompt's strategy hint (prompt.hint).
#   python src/run_search.py port_fam_history --unseeded 3 --targets 16-35,76-95,136-155 --max-parallel 1 --transfer-workers 1
domain: {dataset: families_v0.csv}
llm:
  model: anthropic/claude-sonnet-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [hazard]
  any_order: none
  strict: true
prompt:
  generality: true
  worst_case: true
  examples: false
  compact: true
  hint: "Think about a strategy that works on every instance: how to make progress towards the next goal, how to cross or avoid the patrol without collisions, how slips can hurt, and what to do when the preferred move is unsafe."
feedback: {history: true, words: true}
planner: {retry: never, feedback: failures, max_rounds: 7, chains: 6, done_margin: 0.05,
  pick: candidates, pick_top: 8, repair: 40, repair_tries: 60}
run:
  workers: 4
  train_sets:
  - [0, 4, 8]
  - [60, 64, 68]
  - [120, 124, 128]
