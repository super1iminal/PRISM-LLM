# A stronger model with thinking (vs. R4): Claude Sonnet 5.5 on OpenRouter, Anthropic's endpoint pinned; otherwise
# R4's settings. Its endpoints refuse to turn thinking off, so think is on, and the output cap covers thinking and
# answer: raised so the answer keeps about the room qwen had (the first round thinks ~3k tokens).
# Unseeded: no Sonnet endpoint accepts a seed, so run it once with run_symbolic.py (run_ablation.py sets seeds):
#   python src/run_symbolic.py --condition sonnet5_5 --out out/results/ablations/sonnet5_5/seed_none
llm:
  model: anthropic/claude-sonnet-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
planner:
  retry: "gain:0.05"
