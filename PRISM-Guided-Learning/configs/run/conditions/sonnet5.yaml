# A stronger model (vs. R4): Claude Sonnet 5 on OpenRouter, Anthropic's endpoint pinned, thinking off as for qwen;
# otherwise R4's settings. Unseeded: no Sonnet endpoint accepts a seed, so run it once with run_symbolic.py
# (run_ablation.py sets seeds):
#   python src/run_symbolic.py --condition sonnet5 --out out/results/ablations/sonnet5/seed_none
llm:
  model: anthropic/claude-sonnet-5
  backend: openrouter
  openrouter:
    providers: [anthropic]
planner:
  retry: "gain:0.05"
