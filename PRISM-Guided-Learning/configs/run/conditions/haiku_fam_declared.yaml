# Ablation of haiku_fam_order: `any` rules always take the first allowed action in the declared order (up, right, down, left);
# the verifier chooses nothing (rules.any_order: declared).
domain:
  dataset: families_v0.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [hazard]
  any_order: declared
prompt:
  generality: true
planner:
  retry: never
run:
  workers: 3
  train_sets: [[0, 4, 8], [60, 64, 68], [120, 124, 128]]
