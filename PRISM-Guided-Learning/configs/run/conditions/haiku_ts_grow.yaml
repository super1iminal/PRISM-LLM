# Ablation of haiku_ts_order: counterexample-driven training sets. Once a set is solved, its rules are checked on
# the other nine training grids in order, and the first that fails joins the set (run.pool_sets); 8 rounds
# (control: haiku_ts_order_r8).
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [patrol, early]
  any_order: all
run:
  workers: 4
  train_sets: [[0, 4, 8], [1, 5, 9], [2, 6, 10], [3, 7, 11]]
  pool_sets: [[1, 2, 3, 5, 6, 7, 9, 10, 11], [0, 2, 3, 4, 6, 7, 8, 10, 11], [0, 1, 3, 4, 5, 7, 8, 9, 11], [0, 1, 2, 4, 5, 6, 8, 9, 10]]
prompt:
  generality: true
planner:
  max_rounds: 8
  retry: never
