# Pac-Man, verifier narrowing in the feedback loop: haiku_mi_pacman_long (feedback, no restarts, `any` resolved into the
# best rotation, the core's prompts unchanged) with in-loop narrowing (rules.early_narrow 3, feedback.early on the first
# half of the training games, grouped by Pac-Man's position), stopping at the first passing list (early_tolerance 1).
# Pure resampling (haiku_pac_narrow_core, haiku_pac_narrow_resample) passed training in about 1 of 130 rounds; the
# feedback loop solves training more often. 10 rounds.
#   python src/run_search.py haiku_pac_narrow_fb --unseeded 3 --targets 0-7,9 --max-parallel 1 --transfer-workers 1
domain:
  name: pacman
  dataset: pacman_transfer.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
feedback:
  horizon: domain
  early: steps
  early_group: [xP, yP]
  early_tolerance: 1.0
rules:
  extended: true
  general: true
  hidden_features: [closer_g0, closer_g1]
  any_order: rotations
  early_narrow: 3
prompt:
  generality: true
planner:
  retry: never
  max_rounds: 10
run:
  workers: 1
  train_sets: [[3, 4, 5]]
