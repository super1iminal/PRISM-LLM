# Vocabulary version 2: all gridworld features, including obstacle (the moving obstacle's next cell, from
# obs_idx) and risky (a slip could land on a hazard); otherwise as the version-1 condition of the same name.
# Rule-language branch: as haiku_rl_grid_large, with the shortest-path feature `closer` available too.
#   python src/run_ablation.py haiku_rl2_grid_large_closer --unseeded 1
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: []
