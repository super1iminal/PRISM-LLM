# Pac-Man, the core plus verifier narrowing and nothing else: haiku_mi_pacman_long (feedback loop, no restarts, `any`
# resolved into the first best rotation, prompts unchanged) where, once a candidate passes every member, the verifier
# keeps moves that lose in at least 3/4 of the first-half training situations at a place away from it (rules.early_narrow,
# feedback.early, grouped by Pac-Man's position) if every member still passes. The early loss does not rank lists
# (feedback.early_rank false: in haiku_pac_narrow_fb it picked the one rotation where narrowing misses horizon 20).
# Stops at the first passing list. 20 rounds (haiku_pac_narrow_plain, with 10, left 1 of 5 sets unsolved: training was solved
# in rounds 8, 1, 9, 6 and not within 10).
#   python src/run_search.py haiku_pac_narrow_plain20 --unseeded 5 --targets 0-7,9 --max-parallel 1 --transfer-workers 1
domain:
  name: pacman
  dataset: pacman_transfer.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
feedback:
  horizon: domain
  early: steps
  early_group: [xP, yP]
  early_tolerance: 1.0
  early_rank: false
rules:
  extended: true
  general: true
  hidden_features: [closer_g0, closer_g1]
  any_order: rotations
  early_narrow: 3
prompt:
  generality: true
planner:
  retry: never
  max_rounds: 20
run:
  workers: 1
  train_sets: [[3, 4, 5]]
