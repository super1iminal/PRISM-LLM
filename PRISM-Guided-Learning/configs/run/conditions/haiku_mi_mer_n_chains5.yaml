# haiku_mi_mer_n with planner.chains: 5: five independent loops on the training set, the final list the chain
# whose rules have the largest worst-case margin on the training members (exact check).
#   python src/run_search.py haiku_mi_mer_n_chains5 --unseeded 3 --targets 0-8
domain:
  name: mer
  dataset: mer_n_transfer.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  any_order: rotations
prompt:
  generality: true
planner:
  retry: never
  chains: 5
run:
  workers: 5
  train_sets: [[0, 1, 2]]
