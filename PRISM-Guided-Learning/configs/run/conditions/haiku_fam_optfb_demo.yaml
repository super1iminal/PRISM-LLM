# haiku_fam_order with feedback.optimal and prompt.demonstration together.
domain:
  dataset: families_v0.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [hazard]
  any_order: all
prompt:
  demonstration: true
  generality: true
planner:
  retry: never
run:
  workers: 3
  train_sets: [[0, 4, 8], [60, 64, 68], [120, 124, 128]]
feedback:
  optimal: true
