# Ablation of haiku_ts_order: three hidden members per training set (another set's grids), verified and scored every round
# but never shown to the LLM, which only sees how many of them pass (run.hidden_sets).
domain:
  dataset: grid_20_large.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [patrol, early]
  any_order: all
run:
  workers: 4
  train_sets: [[0, 4, 8], [1, 5, 9], [2, 6, 10], [3, 7, 11]]
  hidden_sets: [[1, 5, 9], [2, 6, 10], [3, 7, 11], [0, 4, 8]]
prompt:
  generality: true
planner:
  retry: never
