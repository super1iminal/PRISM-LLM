# Pac-Man, early-game check: haiku_mi_pacman_long (training horizons 14, 16, 18), plus
# (1) rules.shared_literals: numbers may be compared with the variables whose range is the same on every training
#     member (positions and headings, not steps), so rules can name places in the maze;
# (2) feedback.early: once the rules pass the training members, their move in every state of the first half of each
#     training game (any play reaches it) is scored against the best move there (core/early.py), grouped by rule and
#     place (feedback.early_group); the loop keeps refining while the mean loss exceeds feedback.early_tolerance, and
#     keep-best (and the order for `any`) prefers the lower loss among lists that pass;
# (3) `any` resolved into the best of all 24 action orders (rules.any_order: all) rather than the 4 rotations.
# 10 rounds.
#   python src/run_search.py haiku_pac_early --unseeded 3 --targets 0-7,9 --max-parallel 2 --transfer-workers 1
domain:
  name: pacman
  dataset: pacman_transfer.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
feedback:
  horizon: domain
  early: steps
  early_group: [xP, yP]
rules:
  extended: true
  general: true
  shared_literals: true
  hidden_features: [closer_g0, closer_g1]
  any_order: all
prompt:
  generality: true
planner:
  retry: never
  max_rounds: 10
run:
  workers: 1
  train_sets: [[3, 4, 5]]
