# Item 7 (Rajan's checklist): the restart arm of port_fam_history_luna, `planner.retry: always`, nothing else
# changed. Start only when Asher confirms E1 shows feedback and restarts differ, and this model's Full runs on the
# families are certified.
# Item 3 (Rajan's checklist, SEAMS): OpenAI GPT-6 Luna on OpenRouter, provider pinned to openai ($0.10 / $0.50 per M
# prompt / output tokens, the standard endpoint as listed on 2026-10-19). Reasoning on (`llm.think: true`, OpenRouter's
# reasoning.enabled at the provider's default effort), the closest equivalent of the Haiku runs' extended thinking.
# OpenAI's strict JSON schema needs `additionalProperties: false` (llm.openrouter.schema_adapter; checklist rule 1).
# port_fam_history with only the model, its provider and the schema adapter changed (diff against port_fam_history.yaml).
# port_fam with port_ts_history's four additions (the same flags and hint as port_ts_history adds to port_ts):
# failure locations and risks that count a sequence requirement met once the goal flags show it (feedback.history),
# states and risks in the domain's words (feedback.words), the gridworld rules once and a short text per grid
# (prompt.compact), and the fresh prompt's strategy hint (prompt.hint).
#   python src/run_search.py port_fam_history --unseeded 3 --targets 16-35,76-95,136-155 --max-parallel 1 --transfer-workers 1
domain: {dataset: families_v0.csv}
llm:
  model: openai/gpt-6-luna
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [openai]
    schema_adapter: [no_additional_properties]
rules:
  extended: true
  general: true
  hidden_features: [hazard]
  any_order: none
  strict: true
prompt:
  generality: true
  worst_case: true
  examples: false
  compact: true
  hint: "Think about a strategy that works on every instance: how to make progress towards the next goal, how to cross or avoid the patrol without collisions, how slips can hurt, and what to do when the preferred move is unsafe."
feedback: {history: true, words: true}
planner: {retry: always, feedback: failures, max_rounds: 7, chains: 6, done_margin: 0.05,
  pick: candidates, pick_top: 8, repair: 40, repair_tries: 60}
run:
  workers: 4
  train_sets:
  - [0, 4, 8]
  - [60, 64, 68]
  - [120, 124, 128]
