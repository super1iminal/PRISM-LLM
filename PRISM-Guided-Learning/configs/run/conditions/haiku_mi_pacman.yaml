# Transfer search, Pac-Man: Haiku 5.5 with the general vocabulary (as
# haiku_rl_pacman), one rule set per training set of three horizons (8-10-12, 10-12-14, 12-14-16), the generality
# instruction and no restarts; then certified on horizons 8-25 (pacman_transfer.csv), against 1-2-3-Go!'s 0.869 at 25.
#   python src/run_search.py haiku_mi_pacman --data pacman_transfer.csv --targets 0-7
domain:
  name: pacman
  dataset: pacman.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
feedback:
  horizon: domain
rules:
  extended: true
  general: true
  hidden_features: [closer_g0, closer_g1]   # closer_g0, closer_g1: hidden, so the prompts match this condition's runs
prompt:
  generality: true
planner:
  retry: never
run:
  workers: 3
  train_sets: [[0, 1, 2], [1, 2, 3], [2, 3, 4]]
