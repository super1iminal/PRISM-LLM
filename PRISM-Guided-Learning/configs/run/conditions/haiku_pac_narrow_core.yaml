# Pac-Man, verifier narrowing with the core prompt: pure resampling (planner.retry: always, as the 18-round restarts
# ablation of haiku_mi_pacman_long) with in-loop narrowing (rules.early_narrow 3, feedback.early on the first half of
# the training games, grouped by Pac-Man's position) and no place literals for the LLM: its prompts are exactly the
# core's. haiku_pac_narrow_resample, which also told the LLM it may name places, passed training in 1 of 100 rounds
# against 4 of 39 for the restarts ablation. Stops at the first passing list. 30 rounds.
#   python src/run_search.py haiku_pac_narrow_core --unseeded 5 --targets 0-7,9 --max-parallel 1 --transfer-workers 1
domain:
  name: pacman
  dataset: pacman_transfer.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
feedback:
  horizon: domain
  early: steps
  early_group: [xP, yP]
  early_tolerance: 1.0
rules:
  extended: true
  general: true
  hidden_features: [closer_g0, closer_g1]
  any_order: rotations
  early_narrow: 3
prompt:
  generality: true
planner:
  retry: always
  max_rounds: 30
run:
  workers: 1
  train_sets: [[3, 4, 5]]
