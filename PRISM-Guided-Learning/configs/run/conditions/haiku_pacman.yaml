# Pac-Man (QVBS) with Claude Haiku 5.5 (haiku5_5's settings: thinking on, 16k output cap, Anthropic's endpoint);
# otherwise the default run settings (restart on slow progress). Horizons 8-16, crash <= 0.56 (optimum 0.5511).
# Unseeded: python src/run_ablation.py haiku_pacman --unseeded 1
domain:
  name: pacman
  dataset: pacman.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
feedback:
  horizon: domain     # three transitions per Pac-Man move
