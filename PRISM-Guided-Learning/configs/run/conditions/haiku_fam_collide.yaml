# haiku_fam_order with the optional gridworld feature `collide` (rules.extra_features): the move, or a slip of it, can
# end where the moving obstacle goes next. Fair bar: configs/baselines/{tree,ppo}_features_collide_families.yaml.
domain:
  dataset: families_v0.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [hazard]
  extra_features: [collide]
  any_order: all
prompt:
  generality: true
planner:
  retry: never
run:
  workers: 3
  train_sets: [[0, 4, 8], [60, 64, 68], [120, 124, 128]]
