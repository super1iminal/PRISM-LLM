# Default run configuration. Every key is documented in docs/config.md; the schema is src/config.py.
# A named condition's file (configs/run/conditions/<name>.yaml) and CLI overrides (--set section.key=value)
# apply on top.

approach: symbolic            # symbolic | legacy

domain:
  name: gridworld
  dataset: grid_20_balanced.csv
  visible_extra: [obs_idx]    # state variables rules (and legacy) may also read, when the model has them

llm:
  model: qwen3:14b-q4_K_M
  think: false
  num_ctx: 16384
  num_predict: 8192
  seed: null                  # set per seed by run_ablation.py
  temperature: null           # null = the model's default
  backend: ollama             # serving engine (src/core/backends): ollama | openrouter
  openrouter:                 # llm.backend=openrouter only; llm.model is then an OpenRouter id, e.g. qwen/qwen3-14b
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY   # the variable holding the key; the key itself never goes in a config
    providers: []             # provider slugs, in order, with no fallback (e.g. [deepinfra]); [] = OpenRouter routes
    quantizations: []         # accepted weight precisions (e.g. [fp8, bf16]); [] = any
    timeout_s: 600
    max_retries: 2            # the client's retries on rate limits and server errors

planner:
  max_rounds: 5
  max_fixups: 2               # re-asks per round when the answer has invalid rules
  retry: "gain:0.05"          # stall:k | never | every:k | gain:eps | always (R4, which won the retry sweep)
  branch: joint               # joint (multi-objective best case) | per_requirement (pre_phase_a)
  feedback: blame             # blame (REFINE/EXTEND + blame) | table (results table only, S1)
  max_rules: 64               # schema caps, enforced by constrained decoding
  max_condition_chars: 200
  chains: 1                   # independent loops per training set; the final list: largest worst-case margin on the members
  keep_ties: older            # keep-best on equal scores: older (the kept list stays) | newer (the new candidate is kept)

feedback:
  blame: mass                 # mass | regret (S5) | random (V1) | none (V2)
  horizon: 100                # mass analysis occupancy horizon: steps, or "domain" (its own, e.g. UUV's deadline)
  top_k: 10
  states_per_rule: 3
  space: states               # how feedback names states: states (valuations) | features (feature values per action)
  trajectory: false           # show one likely way the rules fail (a trace from the start), in refine and extend prompts

prompt:
  catch_all_instruction: true
  examples: true
  generality: false           # say the rules will be certified unchanged on unseen, larger instances
  strategy_first: false       # the answer starts with the strategy in words ("strategy"), then the rules
  tie_break: false            # explain that `any` is resolved against the policy, and how to fix an order
  hint: ""                    # extra advice in the policy section, set by a condition ("" = none)

prism:
  method: gaussseidel         # PRISM solver; plain value iteration fails on periodic chains (obstacle-phase rules)
  fallback_methods: [modpoliter]   # tried in order when `method` does not converge (seen on real LLM rule sets)
  java_max_mem: 4g
  max_iters: 1000000
  timeout_s: 900
  multi_engine: sparse        # joint (multi-objective) queries: the explicit engine can't do them
  multi_method: lp            # exact LP; value iteration fails on periodic chains
  exact_check: true           # re-verify the final policy with interval iteration; the run reports those values
  exact_epsilon: "1e-9"       # interval iteration's precision (passed to PRISM as written)
  exact_fallback_epsilon: "1e-12"  # Gauss-Seidel at this epsilon where interval iteration does not converge
  exact_max_iters: 100000000  # chains that leak probability slowly need ~1e7 iterations
  max_concurrent: 8           # PRISM processes at once on the whole machine, across every run and tool (lock-file
                              # slots in the system temp dir; a killed process frees its slot); null: no cap

rules:
  max_enumeration: 200000
  extended: false             # conditions may also use the domain's instance constants and features, and rules the action `any`
  general: false              # only the numbers 0 and 1 in conditions, so rules name instance values (needs extended)
  hidden_features: []         # domain features left out of the vocabulary (e.g. [closer] in gridworld)
  any_order: none             # none | rotations | all: each round, resolve `any` rules into the action order that does
                              # best on the members (verified for each order); declared: always the declared order;
                              # report: keep `any` but tell the LLM the best order; none: worst case over allowed actions
  any_scorer: prism           # prism | domain: what scores the orders. domain: the domain's fast model (gridworld: the
                              # numpy model), PRISM verifies only the chosen order; picks other orders on near-ties
  any_prune: false            # the domain's fast model rules out the orders that cannot score best and PRISM verifies
                              # the rest: the same order as without it, fewer PRISM checks (the run store ignores it)

legacy:
  max_rounds: 5
  retry: never                # stall:k restarts from the initial prompt after k non-improving rounds (L1)
  examples: true              # the two worked examples in the initial prompt (L2: false)

run:
  workers: 2                  # instances in flight: worker threads, the lockstep batch size, or event-loop slots
  limit: null                 # only the first N instances (smoke tests)
  scheduler: null             # threads | lockstep (one batch per step) | event (each instance moves on when its result
                              # arrives); lockstep and event: symbolic only, one thread (docs/scheduler.md).
                              # null: event for symbolic runs, threads for legacy runs
  train_sets: []              # symbolic only: groups of instance ids, one rule set trained on each group; [] = per instance
  hidden_sets: []             # per training set, more instance ids checked and scored but never shown to the LLM
  pool_sets: []               # per training set, candidate ids: once the set is solved, the first that fails joins it
