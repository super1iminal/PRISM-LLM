# Regression check (src/regression.py): a legacy run's per-state policies, re-expressed as symbolic
# rules, must verify identically. Schema: RegressionConfig in src/regression.py; docs/config.md.
# Override with --set key=value, or pass another file with --config.

legacy_run: out/results/legacy_grid20   # the legacy run whose policies are checked (relative to PRISM-Guided-Learning/)
workers: 4                    # policies checked in parallel
epsilon: "1e-9"               # interval-iteration epsilon for the exact check (passed to PRISM as written)
fallback_epsilon: "1e-12"     # Gauss-Seidel epsilon where interval iteration does not converge
tol_stored: 1.0e-9            # stored check: same solver and settings as the legacy run, so values match to rounding
tol_exact: 1.0e-7             # exact check: legacy DTMC vs the new MDP, both with interval iteration
