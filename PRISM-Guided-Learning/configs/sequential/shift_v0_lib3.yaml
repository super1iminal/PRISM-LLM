# shift_v0 with the seed library of core/port_fam_history/seed_none_3 (P6: is reuse a property of the mechanism or of one library?); everything else identical.
# The sequential adaptation study (src/sequential.py; Marsha's review, Oct 18): the manager starts with the three
# rule lists of one core families run (port_fam_history, run 1; order of `any` fixed by src/determinize.py) and
# meets fixed sequences of grid worlds on sequential_v0.csv (domains/gridworld/data/sequential.py): validation
# members of the three families (ids 16-35 rooms, 76-95 crossing, 136-155 adjacent; sizes 10-14) and the 20 random
# grids of grid_20_large (ids 180-199, sizes 9-13), which no seed rule list was written for. Never sealed test ids.
name: shift_v0_lib3
condition: port_fam_history          # generation: the core families configuration (Haiku 5.5, 6 chains, pick, repair)
dataset: sequential_v0.csv
seed_run: out/results/core/port_fam_history/seed_none_3
generation_set:
  - run.workers=2                    # PRISM processes per generation run (CPU headroom: three sequences at once)
max_training: 4                      # the closest rule list's three smallest training instances, plus the one met
sequences:
  # families first (retain and switch), then the shift to random grids (generation, then reuse of what it wrote);
  # 142 is the paper's running example (11x11 adjacent map no seed rule list is certified on)
  - name: s1
    ids: [16, 76, 142, 136, 192, 193, 194, 195, 196, 197, 198, 199]
  # families and random grids interleaved
  - name: s2
    ids: [17, 77, 137, 181, 184, 187, 190, 21, 182, 185, 188, 191]
  - name: s3
    ids: [80, 140, 24, 180, 183, 186, 189, 84, 144, 28, 192, 195]
