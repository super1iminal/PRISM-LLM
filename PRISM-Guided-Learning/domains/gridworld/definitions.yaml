# Gridworld's hand-written features (rule_vocabulary in domain.py), written as definitions over the PRISM
# model (core/definitions.py). tests/test_definitions.py checks that each one holds in exactly the same
# reachable states and actions as the hand-written feature, on every grid of grid_20_large.csv.
# Written for grids with three goals and a moving obstacle (every grid in that dataset).
#
# A move "lands" when it changes the agent's cell: !(x = old(x) & y = old(y)). The hand-written features
# look at the cell a move targets, which is never the patrol path or a goal when the move is blocked.
# A goal entered early is a later goal whose predecessor is not reached yet: ("at_goal2" & !g1) | ("at_goal3" & !g2).
# obstacle needs obs_idx to be policy-visible (the default, domain.visible_extra): `needs`. The order is
# rule_vocabulary's, so prompts list the features exactly as with the hand-written ones.

- name: wall
  description: "true if the move would leave the grid or hit a static obstacle (the agent then stays where it is)"
  definition: 'stays(x, y)'

- name: hazard
  description: "true if the move's target cell is on the moving obstacle's patrol path, or is a goal that must not be entered yet"
  definition: 'next(((exists obs_idx: "at_moving_obs") | ("at_goal2" & !g1) | ("at_goal3" & !g2)) & !(x = old(x) & y = old(y)))'

- name: risky
  description: "true if a slip of this move (to either side) could land on a hazard: the patrol path, or a goal that must not be entered yet"
  definition: 'slip(((exists obs_idx: "at_moving_obs") | ("at_goal2" & !g1) | ("at_goal3" & !g2)) & !(x = old(x) & y = old(y)))'

- name: toward
  description: "true if the move goes towards the next goal not yet reached (fewer rows or columns away)"
  definition:
    up: '("in_seg1" & G1R < x) | ("in_seg2" & G2R < x) | ("in_seg3" & G3R < x)'
    right: '("in_seg1" & G1C > y) | ("in_seg2" & G2C > y) | ("in_seg3" & G3C > y)'
    down: '("in_seg1" & G1R > x) | ("in_seg2" & G2R > x) | ("in_seg3" & G3R > x)'
    left: '("in_seg1" & G1C < y) | ("in_seg2" & G2C < y) | ("in_seg3" & G3C < y)'

- name: closer
  description: "true if the move's target cell is closer to the next goal along a shortest path through free cells (avoiding static obstacles, the patrol path and later goals)"
  definition: >-
    ("in_seg1" & closer_to("at_goal1", avoid (exists obs_idx: "at_moving_obs") | ("at_goal2" & !g1) | ("at_goal3" & !g2)))
    | ("in_seg2" & closer_to("at_goal2", avoid (exists obs_idx: "at_moving_obs") | ("at_goal2" & !g1) | ("at_goal3" & !g2)))
    | ("in_seg3" & closer_to("at_goal3", avoid (exists obs_idx: "at_moving_obs") | ("at_goal2" & !g1) | ("at_goal3" & !g2)))

- name: obstacle
  description: "true if the moving obstacle will be on the move's target cell right after this move"
  definition: 'next("at_moving_obs" & !(x = old(x) & y = old(y)))'
  needs: [obs_idx]
