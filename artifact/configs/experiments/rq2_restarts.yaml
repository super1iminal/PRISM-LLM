# RQ2: the verifier's feedback against pure restarts: the new loop (port_fam, port_mer; on the families the
# core now also has the fixed failure feedback, port_fam_history) against the same
# loop with every answer a fresh sample from the initial prompt (planner.retry: always: no failure report, no attempt
# history, no current list), with the same chains x rounds, stop rule (keep-best, done_margin) and final pick with
# repair. Existing runs only.
#   python src/run_experiment.py configs/experiments/rq2_restarts.yaml
kind: ablation
title: "RQ2: the verifier's feedback against pure restarts"
question: >
  Does the verifier's feedback beat resampling the initial prompt? The new loop against the same loop with pure
  restarts (`port_*_resample`), on the gridworld families and MER across x. Restarts' prompts carry no failure report or
  attempt history, so they cost less per training set (families $0.050 against $0.074, MER $0.283 against $0.337) for
  about as many LLM calls. The feedback runs predate the fix of the failure feedback on gridworld
  (`feedback.history`, Oct 16), so up to a fifth of their failure locations were misleading.
repeats: 3
reference: "Feedback (new loop)"
prices:
  anthropic/claude-haiku-5.5: [0.10, 0.50]
benchmarks:
  families:
    label: "Gridworld families"
    base: port_fam
    targets: "16-35,76-95,136-155"
    groups: {rooms: "16-35", crossing: "76-95", adjacent: "136-155"}
    source_groups: {"0": rooms, "1": crossing, "2": adjacent}
  mer:
    label: "Mars Exploration Rovers across x"
    base: port_mer
    targets: "0-8"
    dataset: mer_transfer.csv
cells:
  - name: "Feedback (new loop)"
    code: Fb
    rules: determinized
    launch: false
  - name: "Pure restarts"
    code: Restarts
    condition: {families: port_fam_resample, mer: port_mer_resample}
    rules: determinized
    launch: false
