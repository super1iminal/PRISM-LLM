# Best of 1000 random deterministic memoryless policies on Pac-Man (src/baselines/simple.py): each a seeded hash of
# the visible state, ranked by its summed crash probability on horizons 14, 16, 18 (ids 3-5); the best is certified
# on the validation horizons.
method: random_policies
condition: pacman_baseline
dataset: pacman_transfer.csv
target_dataset: null
train: "3-5"
targets: "0-9"
workers: 1
exact_near: 0.0
params:
  count: 1000
  seed: 0
