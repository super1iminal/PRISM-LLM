# Best of 1000 random deterministic memoryless policies on Mars Exploration Rovers (src/baselines/simple.py): each a
# seeded hash of the visible state, ranked by its summed error probability on the training instances (ids 0-2); the
# best is certified on ids 0-8.
method: random_policies
condition: mer_baseline
dataset: mer_transfer.csv
target_dataset: null
train: "0-2"
targets: "0-8"
workers: 1
exact_near: 0.0
params:
  count: 1000
  seed: 0
