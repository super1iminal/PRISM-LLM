# Diagnosis: hand-written Pac-Man rule lists over the maze-distance features closer_g0/closer_g1, certified on
# the validation horizons (pacman_transfer.csv ids 0-9), to see whether the vocabulary can hold the optimum beyond horizon 18.
method: rule_lists
condition: pacman_maze_vocabulary   # shows closer_g0/closer_g1, which the LLM conditions hide
dataset: pacman_transfer.csv
target_dataset: null          # targets from another dataset (null: the same)
train: ""
targets: "0-9"
workers: 2
exact_near: 0.0
params:
  lists:
    flee_maze_any:
      - ["!wall & !closer_g0 & !closer_g1", "any"]
      - ["!wall & !closer_g0", "any"]
      - ["!wall & !closer_g1", "any"]
      - ["!wall", "any"]
      - ["true", "right"]
    flee_both_any:
      - ["!wall & !closer_g0 & !closer_g1 & !nearer_g0 & !nearer_g1", "any"]
      - ["!wall & !closer_g0 & !closer_g1", "any"]
      - ["!wall & !closer_g0", "any"]
      - ["!wall & !closer_g1", "any"]
      - ["!wall", "any"]
      - ["true", "right"]
