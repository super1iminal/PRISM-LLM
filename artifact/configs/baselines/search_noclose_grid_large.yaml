# Search over the rule language (src/baselines/feature_search.py) without the shortest-path feature `closer` (the
# features haiku_ts_order_noclose offers), on grid_20_large's training sets, frozen, certified by PRISM on all 20
# grids. RQ1 (configs/experiments/rq1_comparison.yaml, grids_noclose).
method: feature_search
condition: haiku_ts_order_noclose
dataset: grid_20_large.csv
target_dataset: null          # targets from another dataset (null: the same)
train: "0-11"
targets: "0-19"
workers: 6
exact_near: 0.03
params:
  features: [wall, hazard, risky, toward, obstacle]
  max_rules: 6
  beam: 4
  workers: 8
  sets: [[0, 4, 8], [1, 5, 9], [2, 6, 10], [3, 7, 11]]
