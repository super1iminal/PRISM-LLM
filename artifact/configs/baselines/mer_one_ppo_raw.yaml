# PPO on Mars Exploration Rovers trained on one instance (RQ1 mer_one): n = 1, x = 0.01 (id 7), as 1-2-3-Go!'s paper:
# trained on that instance alone by sampling its explicit model, acting on the raw state variables (scaled by their
# declared ranges), reward 1 on reaching the error; three seeds. Frozen as the most likely action per decision state and
# certified through each target's explicit model on ids 0-8 (src/baselines/ppo.py, model: explicit).
method: ppo
condition: mer_baseline
dataset: mer_transfer.csv
target_dataset: null
train: "7"
targets: "0-8"
workers: 1
exact_near: 0.0
params:
  model: explicit
  observation: raw
  steps: 1000000
  envs: 32
  seeds: [0, 1, 2]
