# PPO on Pac-Man with our features (src/baselines/ppo.py, model: explicit): pacman_ppo_raw.yaml, but the network
# sees the rule-language features our core runs see (moves_left; wall, nearer_g0, nearer_g1 per action).
method: ppo
condition: pacman_baseline
dataset: pacman_transfer.csv
target_dataset: null
train: "3-5"
targets: "0-9"
workers: 1
exact_near: 0.0
params:
  model: explicit
  observation: features
  features: [moves_left, wall, nearer_g0, nearer_g1]
  steps: 1000000
  envs: 32
  seeds: [0, 1, 2]
