# PPO (src/baselines/ppo.py) with the view observation, one policy per standard training set of grid_20_large,
# frozen, certified on all 20 grids (validation 12-19). For the sealed test: --set target_dataset=grid_test_large.csv
# --set targets=0-41.
method: ppo
condition: null
dataset: grid_20_large.csv
target_dataset: null
train: "0-11"
targets: "0-19"
workers: 4
exact_near: 0.03
params:
  observation: view
  steps: 2000000
  sets: [[0, 4, 8], [1, 5, 9], [2, 6, 10], [3, 7, 11]]
