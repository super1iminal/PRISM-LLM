# 1-2-3-Go! with our features on Pac-Man (src/baselines/decision_tree.py, model: explicit): pacman_tree_raw.yaml,
# but the tree's inputs are the rule-language features our core runs see (moves_left, and wall, nearer_g0,
# nearer_g1 for each of the four actions; the maze-distance features closer_g* are hidden there too).
method: decision_tree
condition: pacman_baseline
dataset: pacman_transfer.csv
target_dataset: null
train: "3-5,8"
targets: "0-9"
workers: 1
exact_near: 0.03
params:
  model: explicit
  inputs: features
  features: [moves_left, wall, nearer_g0, nearer_g1]
  max_depth: null
  sets: {h5: [8], h14_18: [3, 4, 5]}
