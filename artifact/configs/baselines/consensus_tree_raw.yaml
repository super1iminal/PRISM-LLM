# 1-2-3-Go! reimplemented on randomised consensus across K (N = 3; src/baselines/decision_tree.py, model: explicit): a
# tree over the raw state variables (counter, pc1-pc3, coin1-coin3) learned from every optimal action of the training
# instances' decision states, compiled into rules, frozen and certified on consensus_transfer.csv ids 0-8 (training
# K = 2, 3, 4 and validation K = 5, 6, 8, 10, 12, 16). Two trees: K = 2 (id 0, the smallest instance, as the paper
# trains on one small instance) and K = 2, 3, 4 (ids 0-2, our training set). Ids 9-11 are sealed.
method: decision_tree
condition: consensus_baseline
dataset: consensus_transfer.csv
target_dataset: null
train: "0-2"
targets: "0-8"
workers: 1
exact_near: 0.03
params:
  model: explicit
  inputs: raw
  max_depth: null
  sets: {k2: [0], k2_4: [0, 1, 2]}
