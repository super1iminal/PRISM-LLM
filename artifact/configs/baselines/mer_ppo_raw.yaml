# PPO on Mars Exploration Rovers (src/baselines/ppo.py, model: explicit): trained on x = 0.01, 0.05, 0.13 at n = 10
# (ids 0-2) by sampling their explicit models, acting at decision states on the raw state variables (scaled by their
# declared ranges), reward 1 on reaching the error; three seeds. Frozen as the most likely action per decision state
# and certified through each target's explicit model on ids 0-8.
method: ppo
condition: mer_baseline
dataset: mer_transfer.csv
target_dataset: null
train: "0-2"
targets: "0-8"
workers: 1
exact_near: 0.0
params:
  model: explicit
  observation: raw
  steps: 1000000
  envs: 32
  seeds: [0, 1, 2]
