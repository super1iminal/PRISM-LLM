# PPO on Pac-Man (src/baselines/ppo.py, model: explicit): trained on horizons 14, 16 and 18 (ids 3-5) by sampling
# their explicit models, acting at decision states on the raw state variables (scaled by their declared ranges),
# reward -1 on a crash; three seeds, three sources. Frozen as the most likely action per decision state and
# certified through each target's explicit model on the validation horizons (ids 0-9).
method: ppo
condition: pacman_baseline
dataset: pacman_transfer.csv
target_dataset: null
train: "3-5"
targets: "0-9"
workers: 1
exact_near: 0.0
params:
  model: explicit
  observation: raw
  steps: 1000000
  envs: 32
  seeds: [0, 1, 2]
