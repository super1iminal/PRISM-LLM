# 1-2-3-Go! with our features on Mars Exploration Rovers (src/baselines/decision_tree.py, model: explicit):
# mer_tree_raw.yaml, but the tree's inputs are the rule-language features (shortcuts_left, and enabled for each of
# the 27 actions). The constant X_PCT is not a state feature, so like the raw tree it cannot see x.
method: decision_tree
condition: mer_baseline
dataset: mer_transfer.csv
target_dataset: null
train: "0-2,7"
targets: "0-8"
workers: 1
exact_near: 0.03
params:
  model: explicit
  inputs: features
  features: [shortcuts_left, enabled]
  max_depth: null
  sets: {n1: [7], x_train: [0, 1, 2]}
