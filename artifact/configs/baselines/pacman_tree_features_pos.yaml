# 1-2-3-Go! with our features on Pac-Man, for the conditions with rules.shared_literals (haiku_pac_early_refine): as
# pacman_tree_features.yaml, plus the variables those rules may compare with numbers (positions and headings, the
# variables whose range is the same on every training member; not steps).
method: decision_tree
condition: pacman_baseline
dataset: pacman_transfer.csv
target_dataset: null
train: "3-5"
targets: "0-9"
workers: 1
exact_near: 0.03
params:
  model: explicit
  inputs: features
  features: [moves_left, wall, nearer_g0, nearer_g1, xP, yP, dP, xG0, yG0, dG0, xG1, yG1, dG1]
  max_depth: null
  sets: {h14_18: [3, 4, 5]}
