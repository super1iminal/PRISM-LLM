# The strategy of one instance applied to the others on Pac-Man (src/baselines/simple.py): the
# optimal strategy of horizon 18 (id 5) as a table over the visible state, looked up on the other horizons by
# `steps` (moves made) or by `moves_left` (moves to go). States never seen at 18 stay open (worst case).
method: one_instance
condition: pacman_baseline
dataset: pacman_transfer.csv
target_dataset: null
train: "5"
targets: "0-9"
workers: 1
exact_near: 0.0
params:
  instance: 5
  keys:
    one_instance_steps: [xP, yP, dP, xG0, yG0, dG0, xG1, yG1, dG1, steps]
    one_instance_moves_left: [xP, yP, dP, xG0, yG0, dG0, xG1, yG1, dG1, moves_left]
