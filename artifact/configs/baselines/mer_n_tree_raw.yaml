# 1-2-3-Go! reimplemented on Mars Exploration Rovers across n (x = 0.89; src/baselines/decision_tree.py, model:
# explicit): a tree over the raw state variables learned from every optimal action of the training instances' decision
# states, frozen and certified on mer_n_transfer.csv ids 0-8 (training n = 1, 2, 3 and validation n = 4-15). Two
# trees: n = 1 (id 0, the paper's base instance n = 1) and n = 1, 2, 3 (ids 0-2, our training set). Ids 9-11 are sealed.
method: decision_tree
condition: mer_baseline
dataset: mer_n_transfer.csv
target_dataset: null
train: "0-2"
targets: "0-8"
workers: 1
exact_near: 0.03
params:
  model: explicit
  inputs: raw
  max_depth: null
  sets: {n1: [0], n1_3: [0, 1, 2]}
