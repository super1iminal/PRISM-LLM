# PPO on Pac-Man with our features, for the conditions with rules.shared_literals (haiku_pac_early_refine): as
# pacman_ppo_features.yaml, plus the variables those rules may compare with numbers (positions and headings).
method: ppo
condition: pacman_baseline
dataset: pacman_transfer.csv
target_dataset: null
train: "3-5"
targets: "0-9"
workers: 1
exact_near: 0.0
params:
  model: explicit
  observation: features
  features: [moves_left, wall, nearer_g0, nearer_g1, xP, yP, dP, xG0, yG0, dG0, xG1, yG1, dG1]
  steps: 1000000
  envs: 32
  seeds: [0, 1, 2]
