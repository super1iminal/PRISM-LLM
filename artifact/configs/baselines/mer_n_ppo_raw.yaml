# PPO on Mars Exploration Rovers across n (src/baselines/ppo.py, model: explicit): trained on n = 1, 2, 3 at x = 0.89
# (ids 0-2), acting on the raw state variables (scaled by their declared ranges in training), reward 1 on reaching the
# error; three seeds. Frozen as the most likely action per decision state and certified on ids 0-8.
method: ppo
condition: mer_baseline
dataset: mer_n_transfer.csv
target_dataset: null
train: "0-2"
targets: "0-8"
workers: 1
exact_near: 0.0
params:
  model: explicit
  observation: raw
  steps: 1000000
  envs: 32
  seeds: [0, 1, 2]
