# Best of 1000 random deterministic memoryless policies on Mars Exploration Rovers trained on one instance (RQ1
# mer_one): n = 1, x = 0.01 (id 7), as 1-2-3-Go!'s paper: ranked by their error probability on that instance alone, the
# best is certified on ids 0-8 (src/baselines/simple.py).
method: random_policies
condition: mer_baseline
dataset: mer_transfer.csv
target_dataset: null
train: "7"
targets: "0-8"
workers: 1
exact_near: 0.0
params:
  count: 1000
  seed: 0
