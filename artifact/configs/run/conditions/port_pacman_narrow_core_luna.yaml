# OpenAI GPT-6 Luna on OpenRouter, provider pinned to openai ($0.10 / $0.50 per M
# prompt / output tokens, the standard endpoint as listed on 2026-10-19). Reasoning on (`llm.think: true`, OpenRouter's
# reasoning.enabled at the provider's default effort), the closest equivalent of the Haiku runs' extended thinking.
# OpenAI's strict JSON schema needs `additionalProperties: false` (llm.openrouter.schema_adapter; checklist rule 1).
# port_pacman_narrow_core with only the model, its provider and the schema adapter changed (diff against port_pacman_narrow_core.yaml).
# port_pacman plus verifier narrowing, with port_pacman's prompts unchanged (no place literals for the LLM; the
# verifier's narrowings name places anyway): once the pick has chosen, its list with `any` resolved by the pick's best
# order is narrowed (rules.early_narrow, feedback.early on the first half of the training games, grouped by Pac-Man's
# position; the early loss ranks nothing, the chains stop as port_pacman's). port_pacman_narrow, which also told the
# LLM it may name places, solved training in none of 8 chains on its first run (port_pacman: every run).
#   python src/run_search.py port_pacman_narrow_core --unseeded 3 --targets 0-7,9 --max-parallel 1 --transfer-workers 1
domain: {name: pacman, dataset: pacman_transfer.csv}
llm:
  model: openai/gpt-6-luna
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [openai]
    schema_adapter: [no_additional_properties]
feedback: {horizon: domain, early: steps, early_group: [xP, yP], early_tolerance: 1.0, early_rank: false}
rules:
  extended: true
  general: true
  hidden_features: [closer_g0, closer_g1]
  any_order: none
  strict: true
  early_narrow: 3
prompt: {generality: true, worst_case: true}
planner: {retry: never, feedback: failures, max_rounds: 7, chains: 8, done_margin: 0.002,
  pick: candidates, pick_top: 6, repair: 25, repair_tries: 40}
run:
  workers: 4
  train_sets:
  - [3, 4, 5]
