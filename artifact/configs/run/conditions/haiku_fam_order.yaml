# Gridworld families: haiku_fam_split with `any` rules resolved each round into the action order that does best on
# the training members (rules.any_order: all, 24 orders verified per round). As haiku_fam_split otherwise: `patrol`
# and `early` instead of `hazard`, generality, no restarts.
#   python src/run_search.py haiku_fam_order --targets 16-35,76-95,136-155 --determinize
domain:
  dataset: families_v0.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [hazard]
  any_order: all
prompt:
  generality: true
planner:
  retry: never
run:
  workers: 3
  train_sets: [[0, 4, 8], [60, 64, 68], [120, 124, 128]]
