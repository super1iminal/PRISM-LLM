# Baselines on randomised consensus, not an LLM condition: the rule language baseline policies are written in and
# certified with. The extended vocabulary with numbers allowed (`general: false`), so a decision tree over the raw
# variables compiles into rules such as `counter <= 7 & pc2 >= 1`.
domain:
  name: consensus
  dataset: consensus_transfer.csv
rules:
  extended: true
  general: false
