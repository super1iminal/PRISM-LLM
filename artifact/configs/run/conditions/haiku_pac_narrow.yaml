# Pac-Man, verifier narrowing: haiku_mi_pacman_long (training horizons 14, 16, 18; feedback loop, no restarts), plus
# (1) rules.shared_literals: numbers may be compared with the variables whose range is the same on every training member
#     (positions and headings, not steps), so rules can name places;
# (2) feedback.early with rules.early_narrow: once a candidate passes every member, the moves in the first half of the
#     training games (any play reaches them) are scored against the best moves (core/early.py), grouped by rule and
#     place; a move that loses in at least 3/4 of the situations its rule decides at a place is kept away from that
#     place (`& !(place)` on every rule choosing it) if every member still passes and the early loss drops (up to 3);
#     early_tolerance 1 ends the run at the first passing list;
# (3) `any` resolved into the best of all 24 action orders (rules.any_order: all). 10 rounds.
#   python src/run_search.py haiku_pac_narrow --unseeded 3 --targets 0-7,9 --max-parallel 2 --transfer-workers 1
domain:
  name: pacman
  dataset: pacman_transfer.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
feedback:
  horizon: domain
  early: steps
  early_group: [xP, yP]
  early_tolerance: 1.0
rules:
  extended: true
  general: true
  shared_literals: true
  hidden_features: [closer_g0, closer_g1]
  any_order: all
  early_narrow: 3
prompt:
  generality: true
planner:
  retry: never
  max_rounds: 10
run:
  workers: 1
  train_sets: [[3, 4, 5]]
