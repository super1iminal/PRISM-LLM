# port_pacman_narrow's feedback-only twin: port_pacman plus place literals (rules.shared_literals) and the early check
# as feedback, without the verifier editing the list: once every member passes, the revise prompt also lists the
# moves that lose in the first half of the training games, by rule and place, with the best moves there
# (feedback.early, grouped by Pac-Man's position); the chains keep revising while the early loss exceeds
# feedback.early_tolerance, and keep-best and the pick prefer the lower early loss among equally certified lists.
#   python src/run_search.py port_pacman_early --unseeded 3 --targets 0-7,9 --determinize --max-parallel 1 --transfer-workers 1
domain: {name: pacman, dataset: pacman_transfer.csv}
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
feedback: {horizon: domain, early: steps, early_group: [xP, yP]}
rules:
  extended: true
  general: true
  shared_literals: true
  hidden_features: [closer_g0, closer_g1]
  any_order: none
  strict: true
prompt: {generality: true, worst_case: true}
planner: {retry: never, feedback: failures, max_rounds: 7, chains: 8, done_margin: 0.002,
  pick: candidates, pick_top: 6, repair: 25, repair_tries: 40}
run:
  workers: 4
  train_sets:
  - [3, 4, 5]
