# Mars Exploration Rovers across n, the core configuration (as haiku_mi_mer): one training set of n = 1, 2 and 3 at
# x = 0.89 (mer_n_transfer.csv ids 0-2), certified on the validation instances (ids 3-8: n = 4, 5, 6, 8, 10, 15).
# The optimum grows with n (0.2 at n = 1, 0.44 at 3, 0.69 from 20 on): the scheduler must retry the arbiter's
# shortcut while it can (k < N), which a tree over the raw variables trained on n <= 3 never sees beyond k = 2.
#   python src/run_search.py haiku_mi_mer_n --unseeded 5 --targets 0-8
domain:
  name: mer
  dataset: mer_n_transfer.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  any_order: rotations
prompt:
  generality: true
planner:
  retry: never
run:
  workers: 1
  train_sets: [[0, 1, 2]]
