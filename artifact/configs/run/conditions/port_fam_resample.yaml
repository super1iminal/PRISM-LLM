# port_fam with pure restarts (planner.retry: always): every answer of every chain is a fresh sample from the
# initial prompt (no failure report, no attempt history, no current list), with the same chains x rounds, stop
# rule (keep-best, done_margin), and final pick with repair: the control for the verifier's feedback.
#   python src/run_search.py port_fam_resample --unseeded 3 --targets 16-35,76-95,136-155 --max-parallel 1 --transfer-workers 1
domain: {dataset: families_v0.csv}
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules:
  extended: true
  general: true
  hidden_features: [hazard]
  any_order: none
  strict: true
prompt: {generality: true, worst_case: true, examples: false}
planner: {retry: always, feedback: failures, max_rounds: 7, chains: 6, done_margin: 0.05,
  pick: candidates, pick_top: 8, repair: 40, repair_tries: 60}
run:
  workers: 4
  train_sets:
  - [0, 4, 8]
  - [60, 64, 68]
  - [120, 124, 128]
