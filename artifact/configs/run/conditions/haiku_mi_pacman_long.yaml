# Pac-Man, longer training horizons: haiku_mi_pacman, but one training set of horizons 14, 16 and 18
# (pacman_transfer.csv ids 3-5), `any` rules resolved each round into the best of the four rotations of the action
# order (rules.any_order: rotations), maze-distance features hidden as in haiku_mi_pacman. The frozen rules of
# haiku_mi_pacman hold the optimum up to 18 and fail from 20; certified here on horizons 8-25.
#   python src/run_search.py haiku_mi_pacman_long --targets 0-7
domain:
  name: pacman
  dataset: pacman_transfer.csv
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
feedback:
  horizon: domain
rules:
  extended: true
  general: true
  hidden_features: [closer_g0, closer_g1]
  any_order: rotations
prompt:
  generality: true
planner:
  retry: never
run:
  workers: 1
  train_sets: [[3, 4, 5]]
