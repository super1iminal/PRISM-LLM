# port_mer with pure restarts (planner.retry: always): every answer of every chain is a fresh sample from the
# initial prompt (no failure report, no attempt history, no current list), with the same chains x rounds, stop
# rule (keep-best, done_margin), and final pick with repair: the control for the verifier's feedback.
#   python src/run_search.py port_mer_resample --unseeded 3 --targets 0-8 --max-parallel 1 --transfer-workers 1
domain: {name: mer, dataset: mer_transfer.csv}
llm:
  model: anthropic/claude-haiku-5.5
  backend: openrouter
  think: true
  num_predict: 16384
  openrouter:
    providers: [anthropic]
rules: {extended: true, general: true, any_order: none, strict: true}
prompt: {generality: true, worst_case: true}
planner: {retry: always, feedback: failures, max_rounds: 7, chains: 8, done_margin: 0.002,
  pick: candidates, pick_top: 6, repair: 25, repair_tries: 40}
run:
  workers: 4
  train_sets:
  - [0, 1, 2]
