# 3 sequences of 12 episodes over Pac-Man's 6 validation lengths; library = the three core Pac-Man frozen lists (seed_run lists the three runs: src/sequential.py seeds from each).
# Drawn by src/draw_sequences.py pacman --count 3 --length 12 --seed 21003 (numpy default_rng); same sequences in every library's file of this draw.
# Pool: pacman_transfer.csv ids [0, 1, 2, 6, 7, 9] (validation only).
name: pacman_v0
condition: port_pacman_narrow_core
dataset: pacman_transfer.csv
# 8 GB Java heap: with 4 GB PRISM runs out of heap building the bare model at length 30 (8.3M states), which the
# verifier needs for its forced states; the heap is not part of a run's identity and changes no value.
generation_set: [prism.java_max_mem=8g]
seed_run:
- out/results/core/port_pacman_narrow_core/seed_none_1
- out/results/core/port_pacman_narrow_core/seed_none_2
- out/results/core/port_pacman_narrow_core/seed_none_3
sequences:
- name: r01
  ids: [6, 1, 0, 1, 7, 0, 2, 6, 1, 0, 9, 7]
- name: r02
  ids: [7, 2, 6, 7, 6, 6, 9, 9, 0, 9, 9, 1]
- name: r03
  ids: [1, 6, 9, 9, 9, 0, 2, 0, 1, 0, 2, 7]
